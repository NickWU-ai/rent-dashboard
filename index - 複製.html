<!DOCTYPE html>
<html>
<head>
    <title>物業資產財務管理系統 🏢</title>
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; padding: 40px; color: #1e293b; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        h1 { color: #0f172a; margin: 0; font-size: 28px; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 5px; }
        .btn { padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; }
        .btn-primary { background-color: #2563eb; color: white; }
        .group-section { background-color: #ffffff; border-radius: 16px; padding: 25px; margin-bottom: 30px; border: 1px solid #e2e8f0; }
        
        .group-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px; }
        .group-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; }
        .group-edit-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .group-edit-btn:hover { background-color: #eff6ff; }
        
        .card-container { display: flex; flex-wrap: wrap; gap: 20px; }
        .room-card { background-color: #f8fafc; border-radius: 12px; padding: 20px; width: 340px; position: relative; border: 1px solid #e2e8f0; }
        
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
        .delete-btn { color: #ef4444; }
        .edit-btn { color: #2563eb; }

        .room-number { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .info-text { font-size: 13px; color: #64748b; margin-bottom: 6px; }
        
        .ledger-box { background-color: #ffffff; border-radius: 8px; padding: 12px; margin-top: 15px; border: 1px solid #edf2f7; }
        .ledger-title { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }
        
        .bill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .bill-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #f8fafc; padding: 6px; border-radius: 6px; }
        
        .extra-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #eff6ff; padding: 7px 10px; border-radius: 6px; border: 1px solid #bfdbfe; color: #1e40af; }
        .memo-text { font-size: 11px; color: #64748b; padding-left: 4px; line-height: 1.4; margin: 0 0 10px 0; }

        .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; user-select: none; text-align: center; min-width: 45px; }
        .status-paid { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-unpaid { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; display: none; z-index: 1000; }
        .modal-box { background-color: white; padding: 30px; border-radius: 16px; width: 450px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        
        .form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .custom-item-box { background-color: #f1f5f9; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        .custom-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .custom-list { font-size: 12px; color: #475569; margin-top: 5px; padding-left: 20px; margin-bottom: 0; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        
        /* 阻擋過早按F5的存檔防護罩 */
        #sync-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); display: none; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; color: #2563eb; z-index: 9999; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sync-overlay">
        <div class="spinner"></div>
        <div id="sync-overlay-text">⏳ 資料儲存至雲端中，請稍候...</div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="cloud-form" method="POST" action="https://script.google.com/macros/s/AKfycbyxBdQQQNg2Y0Rmw0wFlkBBr6X8jv-UxgKFrduxrFm6iEJOMS_4hDoZK1ZcqULD2gn-bA/exec" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="jsonString" id="formJsonField">
    </form>

    <div class="header-container">
        <div>
            <h1>物業資產財務管理系統 🏢</h1>
            <div class="subtitle" id="connection-status">🟢 系統載入中...</div>
        </div>
        <div>
            <button class="btn" style="background-color: #64748b; color: white; margin-right: 10px;" onclick="forceDownloadFromCloud()">🔄 雲端同步</button>
            <button class="btn btn-primary" onclick="openGroupModal()">＋ 新增社區</button>
            <button class="btn btn-primary" style="background-color: #10b981;" onclick="openRoomModal()">＋ 新增房源</button>
        </div>
    </div>
    
    <div id="group-zone"></div>

    <div class="modal-overlay" id="groupModal">
        <div class="modal-box">
            <div class="modal-title" id="groupModalTitle">📍 新增社區群組</div>
            <input type="hidden" id="editGroupIndexFlag" value="">
            <div class="form-group">
                <label>社區/街道名稱</label>
                <input type="text" id="inputGroupName" placeholder="例如：福中街">
            </div>
            <div class="modal-buttons">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeGroupModal()">取消</button>
                <button class="btn btn-primary" id="submitGroupBtn" onclick="submitGroup()">確定建立</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="roomModal">
        <div class="modal-box">
            <div class="modal-title" id="roomModalTitle">🚪 新增房源與財務設定</div>
            <input type="hidden" id="editGroupIndex" value="">
            <input type="hidden" id="editRoomIndex" value="">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>隸屬社區</label>
                    <select id="selectGroup"></select>
                </div>
                <div class="form-group">
                    <label>房間號碼</label>
                    <input type="text" id="inputRoomNumber" placeholder="例如：102">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>租客姓名</label>
                    <input type="text" id="inputTenant" placeholder="例如：林小華">
                </div>
                <div class="form-group">
                    <label>租合約期</label>
                    <input type="text" id="inputPeriod" value="2026/06 ~ 2027/05">
                </div>
            </div>
            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 15px 0;">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>💰 每月基本租金</label>
                    <input type="number" id="inputRent" value="12000">
                </div>
                <div class="form-group">
                    <label>🤝 單次房屋押金</label>
                    <input type="number" id="inputDeposit" value="24000">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>🛡️ 每月管理費</label>
                    <input type="number" id="inputManage" value="0">
                </div>
                <div class="form-group">
                    <label>🚗 每月車位費</label>
                    <input type="number" id="inputParking" value="0">
                </div>
            </div>
            <div class="form-group">
                <label>🐾 每月寵物清潔費</label>
                <input type="number" id="inputPet" value="0">
            </div>
            <div class="form-group">
                <label>✍️ 其他臨時特殊月費</label>
                <div class="custom-item-box" id="customItemBoxSection">
                    <div class="custom-input-group">
                        <input type="text" id="customName" placeholder="項目名稱" style="flex: 2;">
                        <input type="number" id="customAmount" placeholder="金額" style="flex: 1;">
                        <button class="btn btn-primary" style="padding: 0 12px; background-color: #475569;" onclick="addCustomBillItem()">＋加入</button>
                    </div>
                    <ul class="custom-list" id="customListVisual"></ul>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeRoomModal()">取消</button>
                <button class="btn btn-primary" style="background-color: #10b981;" id="submitRoomBtn" onclick="submitRoom()">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbyxBdQQQNg2Y0Rmw0wFlkBBr6X8jv-UxgKFrduxrFm6iEJOMS_4hDoZK1ZcqULD2gn-bA/exec";

        let myData = [];
        let tempCustomBills = [];

        // 【安全核心】1. 絕對優先讀取本機資料，拒絕一開機就自動覆蓋
        try {
            let localData = localStorage.getItem("date_driven_landlord_data");
            if (localData && localData !== "[]" && localData !== "undefined") {
                myData = JSON.parse(localData);
            }
        } catch (error) {
            console.error("本地資料異常", error);
            myData = [];
        }

        renderDashboard(false);

        // 【安全核心】2. 只有當「本機完全空空如也」時，才會自動嘗試去雲端抓取
        if (myData.length === 0) {
            document.getElementById("connection-status").innerText = "⏳ 嘗試從雲端還原資料...";
            fetch(CLOUD_API_URL + "?t=" + new Date().getTime())
                .then(res => res.json())
                .then(cloudJson => {
                    if (cloudJson && Object.keys(cloudJson).length > 0) {
                        myData = cloudJson;
                        localStorage.setItem("date_driven_landlord_data", JSON.stringify(myData));
                        renderDashboard(false);
                        document.getElementById("connection-status").innerText = "🟢 雲端資料已成功還原";
                    } else {
                        document.getElementById("connection-status").innerText = "🟢 系統就緒 (目前資料庫為空)";
                    }
                }).catch(e => {
                    document.getElementById("connection-status").innerText = "⚠️ 雲端連線失敗 (目前為單機模式)";
                });
        } else {
            // 本機已有資料，直接顯示就緒，不進行自動覆蓋！
            document.getElementById("connection-status").innerText = "🟢 本機資料就緒";
        }

        // 🌟 新增功能：手動強制從雲端下載 (換電腦時使用)
        function forceDownloadFromCloud() {
            if(!confirm("⚠️ 確定要從雲端下載最新資料嗎？\n\n這會用「雲端的紀錄」覆蓋掉您「目前畫面上的資料」喔！\n(建議僅在更換裝置時使用)")) return;
            
            document.getElementById("sync-overlay").style.display = "flex";
            document.getElementById("sync-overlay-text").innerText = "⬇️ 從雲端下載中，請稍候...";

            fetch(CLOUD_API_URL + "?t=" + new Date().getTime())
                .then(res => res.json())
                .then(cloudJson => {
                    if (cloudJson && Object.keys(cloudJson).length > 0) {
                        myData = cloudJson;
                        localStorage.setItem("date_driven_landlord_data", JSON.stringify(myData));
                        renderDashboard(false);
                        alert("✅ 雲端資料同步完成！");
                    } else {
                        alert("⚠️ 雲端目前沒有任何資料可以下載。");
                    }
                })
                .catch(e => alert("❌ 下載失敗，請檢查網路連線。"))
                .finally(() => {
                    document.getElementById("sync-overlay").style.display = "none";
                    document.getElementById("sync-overlay-text").innerText = "⏳ 資料儲存至雲端中，請稍候..."; // 恢復預設文字
                });
        }

        // 🌟 核心防護：存檔時阻擋畫面，爭取 Google 寫入時間
        function saveToCloud() {
            let syncOverlay = document.getElementById("sync-overlay");
            if(syncOverlay) syncOverlay.style.display = "flex";

            let currentJson = JSON.stringify(myData);
            localStorage.setItem("date_driven_landlord_data", currentJson);

            // 送出到雲端
            document.getElementById("formJsonField").value = currentJson;
            document.getElementById("cloud-form").submit();
            
            // 強制鎖定 2.5 秒，這段時間內無法點擊任何東西，避免過早 F5 導致中斷
            setTimeout(() => {
                if(syncOverlay) syncOverlay.style.display = "none";
            }, 2500);
        }

        function renderDashboard(triggerSave = true) {
            let groupZone = document.getElementById("group-zone");
            groupZone.innerHTML = ""; 

            if (myData.length === 0) {
                groupZone.innerHTML = '<div style="text-align:center; padding:60px; color:#64748b; background:white; border-radius:16px; border:1px dashed #cbd5e1; margin-top:20px;">' +
                    '<p style="font-size:18px; margin-bottom:12px;">👋 歡迎使用！目前系統資料庫是清空狀態。</p>' +
                    '<p style="font-size:14px; margin-bottom:20px;">請點擊右上角的 <strong>「＋ 新增社區」</strong> 開始建立您的物業資產群組吧！</p>' +
                    '</div>';
                return;
            }

            myData.forEach((group, groupIndex) => {
                let groupHTML = '<div class="group-section">' +
                    '<div class="group-header">' +
                        '<h2 class="group-title">📍 ' + group.groupName + ' (' + group.rooms.length + ' 個房源)' +
                            '<button class="group-edit-btn" onclick="openEditGroupModal(' + groupIndex + ')">✏️ 編輯名稱</button>' +
                        '</h2>' +
                    '</div>' +
                    '<div class="card-container" id="gb-' + groupIndex + '"></div>' +
                '</div>';
                
                groupZone.insertAdjacentHTML('beforeend', groupHTML);
                let roomBox = document.getElementById('gb-' + groupIndex);
                
                group.rooms.forEach((room, roomIndex) => {
                    let depositHTML = "";  
                    let monthsHTML = ""; 

                    room.bills.forEach((bill, billIndex) => {
                        let isPaid = bill.paidDate && bill.paidDate.trim() !== "";
                        let statusClass = isPaid ? "status-badge status-paid" : "status-badge status-unpaid";
                        let statusText = isPaid ? bill.paidDate : "未收";
                        
                        if (bill.name.includes("押金")) {
                            depositHTML = '<div class="extra-row"><span>' + bill.name + ': <strong>$' + bill.amount.toLocaleString() + '</strong></span><span class="' + statusClass + '" onclick="changePaidDate(' + groupIndex + ',' + roomIndex + ',' + billIndex + ')">' + statusText + '</span></div>';
                        } else {
                            monthsHTML += '<div class="bill-row"><span>' + bill.name + ': <strong>$' + bill.amount.toLocaleString() + '</strong></span><span class="' + statusClass + '" onclick="changePaidDate(' + groupIndex + ',' + roomIndex + ',' + billIndex + ')">' + statusText + '</span></div>';
                        }
                    });

                    let memoHTML = (room.details || []).map(d => '<li>' + d + '</li>').join("");

                    let roomHTML = '<div class="room-card">' +
                        '<div class="card-actions">' +
                            '<button class="action-btn edit-btn" onclick="openEditRoomModal(' + groupIndex + ',' + roomIndex + ')">✏️</button>' +
                            '<button class="action-btn delete-btn" onclick="deleteRoom(' + groupIndex + ',' + roomIndex + ')">✕</button>' +
                        '</div>' +
                        '<div class="room-number">🚪 ' + room.number + ' 室</div>' +
                        '<div class="info-text">👤 租客: <strong>' + room.tenant + '</strong></div>' +
                        '<div class="info-text">📅 租期: ' + room.rentPeriod + '</div>' +
                        '<div class="ledger-box">' +
                            '<div class="ledger-title">📋 每月收費結構</div>' +
                            '<ul class="memo-text">' + memoHTML + '</ul>' +
                            '<div class="ledger-title">💵 單次收費項目</div>' + depositHTML +
                            '<div class="ledger-title" style="margin-top:10px;">📅 每月實收現金流 (入帳日)</div>' +
                            '<div class="bill-grid">' + monthsHTML + '</div>' +
                        '</div>' +
                    '</div>';
                    roomBox.insertAdjacentHTML('beforeend', roomHTML);
                });
            });
            
            if(triggerSave) saveToCloud();
        }

        function changePaidDate(gIndex, rIndex, bIndex) {
            let currentBill = myData[gIndex].rooms[rIndex].bills[bIndex];
            let oldDate = currentBill.paidDate || "";
            let newDate = prompt("請輸入入帳日期 (留空代表重設為『未收』)：", oldDate);
            if (newDate === null) return;
            currentBill.paidDate = newDate.trim();
            renderDashboard();
        }

        function addCustomBillItem() {
            let cName = document.getElementById("customName").value;
            let cAmount = document.getElementById("customAmount").value;
            if (!cName || !cAmount) return alert("請填寫項目名稱與金額！");
            tempCustomBills.push({ name: cName, amount: Number(cAmount) });
            document.getElementById("customListVisual").innerHTML = tempCustomBills.map(item => '<li>' + item.name + ': (每月 +' + item.amount.toLocaleString() + ')</li>').join("");
            document.getElementById("customName").value = "";
            document.getElementById("customAmount").value = "";
        }

        function openGroupModal() { 
            document.getElementById("groupModalTitle").innerText = "📍 新增社區群組";
            document.getElementById("submitGroupBtn").innerText = "確定建立";
            document.getElementById("editGroupIndexFlag").value = ""; 
            document.getElementById("inputGroupName").value = "";
            document.getElementById("groupModal").style.display = "flex"; 
        }

        function openEditGroupModal(gIndex) {
            document.getElementById("groupModalTitle").innerText = "✏️ 編輯社區名稱";
            document.getElementById("submitGroupBtn").innerText = "儲存修改";
            document.getElementById("editGroupIndexFlag").value = gIndex; 
            document.getElementById("inputGroupName").value = myData[gIndex].groupName;
            document.getElementById("groupModal").style.display = "flex";
        }

        function closeGroupModal() { document.getElementById("groupModal").style.display = "none"; }
        
        function openRoomModal() {
            if (myData.length === 0) return alert("請先建立社區，才能新增房源喔！");

            let select = document.getElementById("selectGroup");
            select.innerHTML = myData.map((g, i) => '<option value="' + i + '">' + g.groupName + '</option>').join("");
            document.getElementById("roomModalTitle").innerText = "🚪 新增房源與財務設定";
            document.getElementById("submitRoomBtn").innerText = "確認新增";
            document.getElementById("editGroupIndex").value = "";
            document.getElementById("editRoomIndex").value = "";
            document.getElementById("customItemBoxSection").style.opacity = "1";
            document.getElementById("customItemBoxSection").style.pointerEvents = "auto";
            tempCustomBills = [];
            document.getElementById("customListVisual").innerHTML = "";
            document.getElementById("inputRoomNumber").value = "";
            document.getElementById("inputTenant").value = "";
            document.getElementById("inputRent").value = "12000";
            document.getElementById("inputDeposit").value = "24000";
            document.getElementById("inputManage").value = "0";
            document.getElementById("inputParking").value = "0";
            document.getElementById("inputPet").value = "0";
            document.getElementById("roomModal").style.display = "flex";
        }

        function openEditRoomModal(gIndex, rIndex) {
            let room = myData[gIndex].rooms[rIndex];
            openRoomModal(); 
            document.getElementById("roomModalTitle").innerText = "✏️ 編輯 🚪 " + room.number + " 室 房源財務";
            document.getElementById("submitRoomBtn").innerText = "儲存修改";
            document.getElementById("editGroupIndex").value = gIndex;
            document.getElementById("editRoomIndex").value = rIndex;
            document.getElementById("customItemBoxSection").style.opacity = "0.5"; 
            document.getElementById("customItemBoxSection").style.pointerEvents = "none";
            document.getElementById("selectGroup").value = gIndex;
            document.getElementById("inputRoomNumber").value = room.number;
            document.getElementById("inputTenant").value = room.tenant;
            document.getElementById("inputPeriod").value = room.rentPeriod;
            document.getElementById("inputRent").value = room.rent || 12000;
            document.getElementById("inputDeposit").value = room.deposit !== undefined ? room.deposit : 24000;
            document.getElementById("inputManage").value = room.manage || 0;
            document.getElementById("inputParking").value = room.parking || 0;
            document.getElementById("inputPet").value = room.pet || 0;
        }

        function closeRoomModal() { document.getElementById("roomModal").style.display = "none"; }

        function submitGroup() {
            let name = document.getElementById("inputGroupName").value;
            if(!name) return alert("請輸入名稱");
            let gIndexFlag = document.getElementById("editGroupIndexFlag").value;
            if (gIndexFlag !== "") { myData[gIndexFlag].groupName = name; } else { myData.push({ groupName: name, rooms: [] }); }
            renderDashboard();
            closeGroupModal();
            document.getElementById("inputGroupName").value = "";
        }

        function submitRoom() {
            let gIndex = document.getElementById("selectGroup").value;
            let num = document.getElementById("inputRoomNumber").value;
            let tenant = document.getElementById("inputTenant").value || "新租客";
            let rent = Number(document.getElementById("inputRent").value);
            let deposit = Number(document.getElementById("inputDeposit").value);
            let period = document.getElementById("inputPeriod").value;
            let manageFee = Number(document.getElementById("inputManage").value) || 0;
            let parkingFee = Number(document.getElementById("inputParking").value) || 0;
            let petFee = Number(document.getElementById("inputPet").value) || 0;

            if(!num) return alert("請輸入房號");

            let oldGroupIndex = document.getElementById("editGroupIndex").value;
            let oldRoomIndex = document.getElementById("editRoomIndex").value;
            let isEdit = oldGroupIndex !== "" && oldRoomIndex !== "";

            let monthlyTotalCash = rent + manageFee + parkingFee + petFee;
            let feeDetailsMemo = ["基本租金: $" + rent.toLocaleString()];
            if (manageFee > 0) feeDetailsMemo.push("管理費: $" + manageFee.toLocaleString());
            if (parkingFee > 0) feeDetailsMemo.push("車位費: $" + parkingFee.toLocaleString());
            if (petFee > 0) feeDetailsMemo.push("寵物費: $" + petFee.toLocaleString());

            let savedCustomTotal = 0;
            if (isEdit) {
                savedCustomTotal = myData[oldGroupIndex].rooms[oldRoomIndex].customTotal || 0;
                monthlyTotalCash += savedCustomTotal;
                let oldCustomDetails = (myData[oldGroupIndex].rooms[oldRoomIndex].details || []).filter(d => !d.includes("基本租金") && !d.includes("管理費") && !d.includes("車位費") && !d.includes("寵物費"));
                feeDetailsMemo = feeDetailsMemo.concat(oldCustomDetails);
            } else {
                tempCustomBills.forEach(item => {
                    monthlyTotalCash += item.amount;
                    savedCustomTotal += item.amount;
                    feeDetailsMemo.push(item.name + ": $" + item.amount.toLocaleString());
                });
            }

            let finalBills = [];
            if (deposit > 0) {
                let savedOldDepositDate = "";
                if (isEdit) {
                    let oldRoom = myData[oldGroupIndex].rooms[oldRoomIndex];
                    let oldDep = oldRoom.bills.find(b => b.name.includes("押金"));
                    if (oldDep) savedOldDepositDate = oldDep.paidDate || "";
                }
                finalBills.push({ name: "🤝 房屋押金", amount: deposit, paidDate: savedOldDepositDate });
            }

            for (let i = 1; i <= 12; i++) {
                let monthLabel = i < 10 ? "0" + i : i; 
                let savedOldDate = "";
                if (isEdit) {
                    let oldRoom = myData[oldGroupIndex].rooms[oldRoomIndex];
                    let oldBill = oldRoom.bills.find(b => b.name === "M" + monthLabel + " 總應收");
                    if (oldBill) savedOldDate = oldBill.paidDate || ""; 
                }
                finalBills.push({ name: "M" + monthLabel + " 總應收", amount: monthlyTotalCash, paidDate: savedOldDate });
            }

            let roomObject = {
                number: num, tenant: tenant, rentPeriod: period, rent: rent, deposit: deposit, manage: manageFee, parking: parkingFee, pet: petFee, customTotal: savedCustomTotal, details: feeDetailsMemo, bills: finalBills
            };

            if (isEdit) {
                if (oldGroupIndex != gIndex) { myData[oldGroupIndex].rooms.splice(oldRoomIndex, 1); myData[gIndex].rooms.push(roomObject); } else { myData[gIndex].rooms[oldRoomIndex] = roomObject; }
            } else { myData[gIndex].rooms.push(roomObject); }

            renderDashboard();
            closeRoomModal();
        }

        function deleteRoom(gIndex, rIndex) {
            if(confirm("確定刪除？")) { myData[gIndex].rooms.splice(rIndex, 1); renderDashboard(); }
        }
    </script>
</body>
</html>
