<!DOCTYPE html>
<html>
<head>
    <title>物業資產財務管理系統 🏢</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; padding: 40px; color: #1e293b; margin: 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #0f172a; margin: 0; font-size: 28px; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 5px; }
        .btn { padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; transition: background 0.2s; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-success { background-color: #16a34a; color: white; }
        .group-section { background-color: #ffffff; border-radius: 16px; padding: 25px; margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .group-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px; }
        .group-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; }
        .group-edit-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .group-edit-btn:hover { background-color: #eff6ff; }
        
        .card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .room-card { background-color: #f8fafc; border-radius: 12px; padding: 20px; position: relative; border: 1px solid #e2e8f0; transition: all 0.2s; box-sizing: border-box; }
        .room-card.expiry-warning { border: 2px solid #f97316 !important; background-color: #fff7ed !important; }
        .room-card.draggable { cursor: grab; user-select: none; }
        .room-card.draggable:active { cursor: grabbing; }
        .room-card.dragging { opacity: 0.4; border: 2px dashed #2563eb; background-color: #eff6ff; }
        
        .expiry-badge { background-color: #ffedd5; color: #ea580c; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; display: inline-block; border: 1px solid #fed7aa; }
        
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 10; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
        .delete-btn { color: #ef4444; font-weight: bold; font-size: 16px; }
        .edit-btn { color: #2563eb; font-weight: bold; font-size: 14px; }
        .room-number { font-size: 18px; font-weight: 700; margin-bottom: 12px; padding-right: 50px; }
        .info-text { font-size: 13px; color: #64748b; margin-bottom: 6px; }
        .memo-badge { background-color: #fffbeb; color: #b45309; border: 1px dashed #fde68a; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 8px; margin-bottom: 4px; line-height: 1.4; word-break: break-all; }
        .ledger-box { background-color: #ffffff; border-radius: 8px; padding: 12px; margin-top: 15px; border: 1px solid #edf2f7; }
        .ledger-title { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .bill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .bill-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #f8fafc; padding: 6px; border-radius: 6px; }
        .extra-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #eff6ff; padding: 7px 10px; border-radius: 6px; border: 1px solid #bfdbfe; color: #1e40af; }
        .memo-text { font-size: 11px; color: #64748b; padding-left: 20px; line-height: 1.4; margin: 0 0 10px 0; }
        
        .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; user-select: none; text-align: center; min-width: 45px; display: inline-block; }
        .status-paid { background-color: #dcfce7; color: #15803d; }
        .status-unpaid { background-color: #fee2e2; color: #b91c1c; }

        .trash-section { background-color: #f1f5f9; border: 2px dashed #94a3b8; border-radius: 16px; padding: 25px; margin-top: 40px; }
        .trash-section.has-items { background-color: #fff5f5; border-color: #fca5a5; }
        .trash-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #cbd5e1; padding-bottom: 12px; margin-bottom: 20px; }
        .trash-section.has-items .trash-header { border-bottom-color: #fee2e2; }
        .trash-title { font-size: 20px; font-weight: 700; color: #475569; display: flex; align-items: center; gap: 8px; margin: 0; }
        .trash-section.has-items .trash-title { color: #991b1b; }
        .trash-subsection-title { font-size: 14px; font-weight: 700; color: #475569; margin: 15px 0 8px 0; padding-left: 5px; border-left: 4px solid #94a3b8; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; display: none; z-index: 1000; }
        .modal-box { background-color: white; padding: 30px; border-radius: 16px; width: 460px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .custom-item-box { background-color: #f1f5f9; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        .custom-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .custom-list { font-size: 12px; color: #475569; margin-top: 5px; padding-left: 20px; margin-bottom: 0; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        
        #sync-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); display: none; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; color: #2563eb; z-index: 9999; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            body { padding: 15px; }
            .header-container { flex-direction: column; align-items: flex-start; gap: 15px; }
            .header-container div:last-child { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
            .btn { flex: 1 1 45%; text-align: center; padding: 12px 10px; font-size: 13px; }
            .top-grid { grid-template-columns: 1fr !important; gap: 15px; }
            .top-grid > div { height: auto !important; }
            .toolbar-container { flex-direction: column; align-items: stretch !important; gap: 12px; }
            .toolbar-container .controls-wrapper { flex-direction: column; align-items: stretch !important; gap: 10px; }
            .toolbar-container .control-item { width: 100%; justify-content: space-between; }
            .toolbar-container select { flex: 1; max-width: 60%; box-sizing: border-box; }
            .toolbar-container button { width: 100%; }
            .card-container { grid-template-columns: 1fr !important; }
            .modal-box { width: 95%; padding: 20px; }
            .form-row-grid { grid-template-columns: 1fr; gap: 0; }
            .status-badge { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="sync-overlay">
        <div class="spinner"></div>
        <div id="sync-overlay-text">⏳ 資料儲存至雲端中，請稍候...</div>
    </div>

    <div class="header-container">
        <div>
            <h1>物業資產財務管理系統 🏢</h1>
            <div class="subtitle" id="connection-status">🟢 系統載入中...</div>
        </div>
        <div>
            <button type="button" class="btn" id="viewerBtn" style="background-color: #0ea5e9; color: white;" onclick="toggleViewMode()">👁️ 完整閱覽登入</button>
            <button type="button" class="btn" id="adminBtn" style="background-color: #475569; color: white;" onclick="toggleAdminMode()">🔐 管理員登入</button>
            <button type="button" class="btn" id="headerSync" style="background-color: #64748b; color: white;" onclick="forceDownloadFromCloud()">🔄 雲端同步</button>
            <button type="button" class="btn" id="backupBtn" style="background-color: #f59e0b; color: white;" onclick="downloadBackup()">📥 下載備份</button>
            <button type="button" class="btn btn-primary" id="headerAddGroup" onclick="openGroupModal()">＋ 新增社區</button>
            <button type="button" class="btn btn-primary" id="headerAddRoom" style="background-color: #10b981;" onclick="openRoomModal()">＋ 新增房源</button>
        </div>
    </div>
    
    <div id="topFinancialGrid" class="top-grid" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 25px;">
        <div id="dashboard-zone" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;"></div >
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; height: 230px; box-sizing: border-box;">
            <div style="font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 10px;">📊 年度歷史實收租金趨勢</div>
            <div style="height: 160px; position: relative;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>

    <div class="toolbar-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
        <div class="controls-wrapper" style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <div class="control-item" style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 14px; font-weight: 700; color: #1e293b;">📅 選擇年度：</span>
                <select id="yearSelect" onchange="handleYearChange(this.value)" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #ffffff; color:#2563eb; font-weight:700;">
                    <option value="2025">2025 年</option>
                    <option value="2026">2026 年</option>
                    <option value="2027">2027 年</option>
                    <option value="2028">2028 年</option>
                    <option value="2029">2029 年</option>
                    <option value="2030">2030 年</option>
                    <option value="2031">2031 年</option>
                    <option value="2032">2032 年</option>
                    <option value="2033">2033 年</option>
                    <option value="2034">2034 年</option>
                    <option value="2035">2035 年</option>
                    <option value="2036">2036 年</option>
                </select>
            </div>
            <div class="control-item" style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 14px; font-weight: 600; color: #475569;">🔍 篩選條件：</span>
                <select id="filterSelect" onchange="handleFilterChange(this.value)" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #f8fafc; color:#1e293b; font-weight:600;">
                    <option value="all">1. 全部房源</option>
                    <option value="vacant">2. 有房間但沒租約 (待租中房源)</option>
                    <option value="unpaid">3. 未繳租金</option>
                    <optgroup label="4. 房屋群組 (單獨社區顯示)" id="dropdownGroupSection">
                    </optgroup>
                </select>
            </div>
        </div>
        <button type="button" id="exportBtn" class="btn" style="background-color: #16a34a; color: white;" onclick="exportToCSV()">📊 匯出本月 Excel 報表</button>
    </div>
    
    <div id="group-zone"></div>
    <div id="trash-zone"></div>

    <div class="modal-overlay" id="groupModal">
        <div class="modal-box">
            <div class="modal-title" id="groupModalTitle">📍 新增社區群組</div>
            <input type="hidden" id="editGroupIndexFlag" value="">
            <div class="form-group">
                <label>社區/街道名稱</label>
                <input type="text" id="inputGroupName" placeholder="例如：福中街">
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn" style="background-color:#cbd5e1;" onclick="closeGroupModal()">取消</button>
                <button type="button" class="btn btn-primary" id="submitGroupBtn" onclick="submitGroup()">確定建立</button>
            </div>
        </div>
    </div>

    <!-- 編輯房間彈窗 -->
    <div class="modal-overlay" id="roomModal">
        <div class="modal-box">
            <div class="modal-title" id="roomModalTitle">🚪 新增房源與財務設定</div>
            <input type="hidden" id="editGroupIndex" value="">
            <input type="hidden" id="editRoomIndex" value="">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>隸屬社區</label>
                    <select id="selectGroup"></select>
                </div>
                <div class="form-group">
                    <label>房間號碼</label>
                    <input type="text" id="inputRoomNumber" placeholder="例如：102">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>租客姓名</label>
                    <input type="text" id="inputTenant" placeholder="Example: 林小華">
                </div>
                <div class="form-group">
                    <label>租合約期</label>
                    <input type="text" id="inputPeriod" value="2026/06 ~ 2027/05" placeholder="格式範例: 2026/06 ~ 2027/05">
                </div>
            </div>
            <div class="form-group">
                <label>📝 房源備註事項</label>
                <input type="text" id="inputMemo" placeholder="例如：冷氣剛換新、車位在B2...">
            </div>

            <!-- 獨立計費區外框 -->
            <div class="form-group" id="utilityCalculatorWrapper">
                <label>⚡ 獨立水電費計算機 (自動匯入臨時特殊月費)</label>
                <div class="custom-item-box" style="background-color: #f0fdf4; border-color: #bbf7d0; margin-bottom: 10px;">
                    <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 6px; margin-bottom: 8px;">
                        <input type="text" id="calcName" value="電費" style="padding:6px;">
                        <input type="number" id="calcPrev" placeholder="上次" style="padding:6px;">
                        <input type="number" id="calcCurr" placeholder="本次" style="padding:6px;">
                        <input type="number" id="calcRate" value="5" placeholder="單價" style="padding:6px;">
                    </div>
                    <button type="button" class="btn" style="background-color: #16a34a; color: white; width: 100%; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 4px;" onclick="calculateUtility()">🧮 計算並匯入下方項目</button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 15px 0;">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>💰 每月基本租金</label>
                    <input type="number" id="inputRent" value="12000">
                </div>
                <div class="form-group">
                    <label>🤝 單次房屋押金</label>
                    <input type="number" id="inputDeposit" value="24000">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>🛡️ 每月管理費</label>
                    <input type="number" id="inputManage" value="0">
                </div>
                <div class="form-group">
                    <label>🚗 每月車位費</label>
                    <input type="number" id="inputParking" value="0">
                </div>
            </div>
            <div class="form-group">
                <label>🐾 每月寵物清潔費</label>
                <input type="number" id="inputPet" value="0">
            </div>
            
            <!-- 自訂臨時項目區外框 -->
            <div class="form-group" id="customBillSectionWrapper">
                <label>✍️ 其他臨時特殊月費</label>
                <div class="custom-item-box" id="customItemBoxSection">
                    <div class="custom-input-group">
                        <input type="text" id="customName" placeholder="項目名稱" style="flex: 2;">
                        <input type="number" id="customAmount" placeholder="金額" style="flex: 1;">
                        <button type="button" class="btn btn-primary" style="padding: 0 12px; background-color: #475569;" onclick="addCustomBillItem()">＋加入</button>
                    </div>
                    <ul class="custom-list" id="customListVisual"></ul>
                </div>
            </div>
            
            <div class="modal-buttons">
                <button type="button" class="btn" style="background-color:#cbd5e1;" onclick="closeRoomModal()">取消</button>
                <button type="button" class="btn btn-primary" style="background-color: #10b981;" id="submitRoomBtn" onclick="submitRoom()">儲存房源</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec";
        
        let isAdmin = false;
        let isFullView = false; 
        const ADMIN_PASSWORD = "2007"; 
        const VIEWER_PASSWORD = "5678"; 

        let myData = {}; 
        let selectedYear = "2026"; 
        let tempCustomBills = [];
        let currentFilter = 'all'; 
        let chartInstance = null;

        try {
            let localData = localStorage.getItem("date_driven_landlord_data");
            if (localData && localData !== "[]" && localData !== "undefined") {
                let parsed = JSON.parse(localData);
                if (Array.isArray(parsed)) {
                    myData = {}; myData[selectedYear] = parsed;
                } else {
                    myData = parsed;
                }
            }
        } catch (e) { console.error("本地資料讀取異常", e); }

        if (!myData[selectedYear]) myData[selectedYear] = [];
        if (!myData["trash_bin"]) myData["trash_bin"] = [];
        if (!myData["room_trash_bin"]) myData["room_trash_bin"] = [];
        document.getElementById("yearSelect").value = selectedYear;

        function checkPermission() {
            if (!isAdmin) {
                alert("🔒 目前為「唯讀模式」，不允許執行此操作。\n若需使用，請先點擊網頁右上角的「管理員登入」。");
                return false;
            }
            return true;
        }

        function toggleViewMode() {
            if (isFullView) {
                isFullView = false;
                alert("已切換回「訪客看房模式」，系統將自動鎖定僅顯示待租中房源。");
            } else {
                let pass = prompt("🔑 請輸入閱覽者密碼以查看完整房源與財務資產：");
                if (pass === VIEWER_PASSWORD) {
                    isFullView = true;
                    alert("🔓 密碼正確！已解鎖完整房源瀏覽與報表檢視模式。");
                } else if (pass !== null) {
                    alert("❌ 密碼錯誤，保持訪客模式！");
                }
            }
            renderDashboard(false);
        }

        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                isFullView = false;
                alert("已登出管理員身分。系統切換回「訪客看房模式」。");
            } else {
                let pass = prompt("🔑 請輸入管理員密碼：");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    isFullView = true; 
                    alert("🔓 密碼正確！已開啟主控編輯權限。");
                } else if (pass !== null) {
                    alert("❌ 密碼錯誤，保持訪客模式！");
                }
            }
            renderDashboard(false);
        }

        function updateAuthUI() {
            const adminBtn = document.getElementById("adminBtn");
            const viewerBtn = document.getElementById("viewerBtn");
            const btnAddGroup = document.getElementById("headerAddGroup");
            const btnAddRoom = document.getElementById("headerAddRoom");
            const btnSync = document.getElementById("headerSync");
            const btnBackup = document.getElementById("backupBtn");
            const topFinancialGrid = document.getElementById("topFinancialGrid");
            const exportBtn = document.getElementById("exportBtn");
            
            if (isAdmin) {
                adminBtn.innerHTML = "🔓 管理模式 (登出)";
                adminBtn.style.backgroundColor = "#dc2626";
                if(btnAddGroup) btnAddGroup.style.display = "inline-block";
                if(btnAddRoom) btnAddRoom.style.display = "inline-block";
                if(btnSync) btnSync.style.display = "inline-block";
                if(btnBackup) btnBackup.style.display = "inline-block";
                viewerBtn.style.display = "none";
            } else {
                adminBtn.innerHTML = "🔐 管理員登入";
                adminBtn.style.backgroundColor = "#475569";
                if(btnAddGroup) btnAddGroup.style.display = "none";
                if(btnAddRoom) btnAddRoom.style.display = "none";
                if(btnSync) btnSync.style.display = "none";
                if(btnBackup) btnBackup.style.display = "none";
                viewerBtn.style.display = "inline-block";
                
                if (isFullView) {
                    viewerBtn.innerHTML = "👁️ 模式：完整閱覽 (切回訪客)";
                    viewerBtn.style.backgroundColor = "#0284c7";
                } else {
                    viewerBtn.innerHTML = "👁️ 完整閱覽登入";
                    viewerBtn.style.backgroundColor = "#0ea5e9";
                }
            }

            if (isAdmin || isFullView) {
                if(topFinancialGrid) topFinancialGrid.style.display = "grid";
                if(exportBtn) exportBtn.style.display = "inline-block";
            } else {
                if(topFinancialGrid) topFinancialGrid.style.display = "none";
                if(exportBtn) exportBtn.style.display = "none";
            }
        }

        function generateLeaseMonths(periodStr) {
            let months = [];
            let defaultYear = parseInt(selectedYear) || new Date().getFullYear();
            let fallback = [];
            for(let i=1; i<=12; i++) {
                fallback.push(`${defaultYear}/${String(i).padStart(2, '0')}`);
            }
            if (!periodStr || !periodStr.includes("~")) return fallback;
            
            try {
                let parts = periodStr.split("~");
                let startPart = parts[0].trim();
                let startYM = startPart.split("/");
                let sYear = parseInt(startYM[0]);
                let sMonth = parseInt(startYM[1]);
                if(isNaN(sYear) || isNaN(sMonth)) return fallback;

                for(let i = 0; i < 12; i++) {
                    let currentMonth = sMonth + i;
                    let currentYear = sYear;
                    if (currentMonth > 12) {
                        currentYear += Math.floor((currentMonth - 1) / 12);
                        currentMonth = ((currentMonth - 1) % 12) + 1;
                    }
                    months.push(`${currentYear}/${String(currentMonth).padStart(2, '0')}`);
                }
                return months;
            } catch(e) { return fallback; }
        }

        function checkLeaseExpiry(periodStr) {
            if (!periodStr || !periodStr.includes("~")) return { warning: false, text: "" };
            try {
                let parts = periodStr.split("~");
                let endPart = parts[1].trim(); 
                let endYM = endPart.split("/");
                let endYear = parseInt(endYM[0]);
                let endMonth = parseInt(endYM[1]) - 1;
                let endDate = new Date(endYear, endMonth + 1, 0); 
                let today = new Date();
                let timeDiff = endDate.getTime() - today.getTime();
                let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
                if (daysDiff < 0) return { warning: true, text: "⚠️ 租約已過期！" };
                if (daysDiff <= 45) return { warning: true, text: `⚠️ 租約剩 ${daysDiff} 天到期` };
            } catch(e) {}
            return { warning: false, text: "" };
        }

        function calculateUtility() {
            let name = document.getElementById("calcName").value || "電費";
            let prev = document.getElementById("calcPrev").value;
            let curr = document.getElementById("calcCurr").value;
            let rate = Number(document.getElementById("calcRate").value) || 5;
            if (prev === "" || curr === "") return alert("請輸入完整度數！");
            let pNum = Number(prev), cNum = Number(curr);
            if (cNum < pNum) return alert("本次度數不能小於上次度數喔！");
            let degrees = cNum - pNum;
            let total = degrees * rate;
            tempCustomBills.push({ name: `${name}(${degrees}度,${pNum}→${cNum})`, amount: total });
            document.getElementById("customListVisual").innerHTML = tempCustomBills.map(item => `<li>${item.name}: (每月 +${item.amount.toLocaleString()})</li>`).join("");
            document.getElementById("calcPrev").value = ""; document.getElementById("calcCurr").value = "";
        }

        function drawChart() {
            let monthlyCashflow = Array(12).fill(0);
            let activeData = myData[selectedYear] || [];
            
            activeData.forEach(g => g.rooms.forEach(r => r.bills.forEach(b => {
                if (b.paidDate && b.paidDate.trim() !== "") {
                    let cleaned = b.paidDate.trim();
                    let mIdx = -1;

                    if (/^\d{4}$/.test(cleaned)) {
                        let shortYear = "20" + cleaned.substring(0, 2); 
                        let monthStr = cleaned.substring(2, 4);        
                        if (shortYear === selectedYear) { mIdx = parseInt(monthStr) - 1; }
                    } else {
                        let matches = cleaned.match(/\d+/g); 
                        if (matches && matches.length > 0) {
                            if (matches.length >= 3) {
                                let yearStr = matches[0]; let monthStr = matches[1];
                                if (yearStr === selectedYear || yearStr.endsWith(selectedYear.substring(2))) {
                                    mIdx = parseInt(monthStr) - 1;
                                }
                            } else if (matches.length === 2) { mIdx = parseInt(matches[0]) - 1;
                            } else if (matches.length === 1) { mIdx = parseInt(matches[0]) - 1; }
                        }
                    }
                    if (mIdx >= 0 && mIdx < 12) { monthlyCashflow[mIdx] += b.amount; }
                }
            })));

            let ctx = document.getElementById('revenueChart');
            if (!ctx) return;
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                    datasets: [{
                        label: `${selectedYear} 年實收租金現金流`,
                        data: monthlyCashflow,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.08)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

                                            <div class="ledger-title">💵 單次收費項目</div>${depositHTML}
                                            <div class="ledger-title" style="margin-top:10px;">📅 合約實收現金流 (入帳日)</div>
                                            <div class="bill-grid">${monthsHTML}</div>
                                        </div>
                                    </div>`;
                            }).join("")}
                        </div>
                    </div>`;
                }).join("");
            }

            if (isAdmin || isFullView) {
                let hasGroupTrash = myData["trash_bin"] && myData["trash_bin"].length > 0;
                let hasRoomTrash = myData["room_trash_bin"] && myData["room_trash_bin"].length > 0;
                let isTrashEmpty = !hasGroupTrash && !hasRoomTrash;

                let groupTrashHTML = hasGroupTrash ? myData["trash_bin"].map((item, tIdx) => `
                    <div style="background: white; border: 1px solid #fee2e2; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <div>
                            <span style="font-weight: bold; color: #b91c1c;">📍 [社區] ${item.groupName}</span> 
                            <span style="color: #64748b; font-size: 13px;">(內含 ${item.rooms.length} 間房, 刪除自 ${item.deletedFromYear || selectedYear} 年)</span>
                        </div>
                        ${isAdmin ? `
                        <div>
                            <button type="button" class="btn btn-success" style="padding: 4px 10px; font-size: 12px;" onclick="restoreGroupFromTrash(${tIdx})">↩️ 還原社區</button>
                            <button type="button" class="btn btn-danger" style="padding: 4px 10px; font-size: 12px;" onclick="deleteTrashItemPermanently(${tIdx})">✕ 粉碎</button>
                        </div>` : ''}
                    </div>
                `).join("") : `<div style="text-align:center; padding:10px; color:#94a3b8; font-size:13px;">無遭刪除的社區</div>`;

                let roomTrashHTML = hasRoomTrash ? myData["room_trash_bin"].map((item, rIdx) => `
                    <div style="background: white; border: 1px solid #fee2e2; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <div>
                            <span style="font-weight: bold; color: #ea580c;">🚪 [房間] ${item.roomData.number} 室</span> 
                            <span style="color: #475569; font-size: 13px;">(原隸屬：${item.originalGroupName}, 租客: ${item.roomData.tenant})</span>
                        </div>
                        ${isAdmin ? `
                        <div>
                            <button type="button" class="btn btn-success" style="padding: 4px 10px; font-size: 12px;" onclick="restoreRoomFromTrash(${rIdx})">↩️ 還原房間</button>
                            <button type="button" class="btn btn-danger" style="padding: 4px 10px; font-size: 12px;" onclick="deleteRoomTrashPermanently(${rIdx})">✕ 粉碎</button>
                        </div>` : ''}
                    </div>
                `).join("") : `<div style="text-align:center; padding:10px; color:#94a3b8; font-size:13px;">無遭刪除的房間</div>`;

                trashZone.innerHTML = `
                <div class="trash-section ${!isTrashEmpty ? 'has-items' : ''}">
                    <div class="trash-header">
                        <h2 class="trash-title">🗑️ 垃圾桶暫存區管理 ${isTrashEmpty ? '(空)' : '(安全暫存保護中)'}</h2>
                        ${(isAdmin && !isTrashEmpty) ? `<button type="button" class="btn btn-danger" style="padding: 5px 12px; font-size: 12px;" onclick="clearAllTrash()">⚠️ 一鍵粉碎清空</button>` : ''}
                    </div>
                    ${isTrashEmpty ? `
                        <div style="text-align:center; padding: 15px 0; color:#94a3b8; font-size:14px;">暫存區目前空空如也 📭 <br><small style="color:#94a3b8;">(不論刪除社區或單獨房間，皆會即時被打包儲存於此)</small></div>
                    ` : `
                        <div class="trash-subsection-title">📂 已刪除的社區群組</div>
                        ${groupTrashHTML}
                        <div class="trash-subsection-title" style="margin-top:15px;">微型卡片：已刪除的個別房間</div>
                        ${roomTrashHTML}
                    `}
                </div>`;
            } else { trashZone.innerHTML = ""; }
            
            if (isAdmin || isFullView) drawChart();
            if(triggerSave) await saveToCloud();
        }

        let dragSourceGroupIndex = null;
        let dragSourceRoomIndex = null;

        function handleDragStart(e, gIdx, rIdx) {
            if (!isAdmin) return;
            dragSourceGroupIndex = gIdx; dragSourceRoomIndex = rIdx;
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = "move";
        }

        function handleDragEnd(e) { e.currentTarget.classList.remove('dragging'); }
        function allowDrop(e) { if (!isAdmin) return; e.preventDefault(); }

        async function handleDrop(e) {
            if (!isAdmin) return;
            e.preventDefault();
            let targetContainer = e.currentTarget.closest('.card-container');
            if (!targetContainer) return;
            
            let targetGroupIdx = parseInt(targetContainer.getAttribute('data-group-index'));
            let targetCard = e.target.closest('.room-card');
            let activeData = myData[selectedYear] || [];
            let targetRoomIdx = activeData[targetGroupIdx].rooms.length; 
            
            if (targetCard) { targetRoomIdx = parseInt(targetCard.getAttribute('data-room-index')); }

            if (dragSourceGroupIndex !== null && dragSourceRoomIndex !== null) {
                let movingRoom = activeData[dragSourceGroupIndex].rooms.splice(dragSourceRoomIndex, 1)[0];
                activeData[targetGroupIdx].rooms.splice(targetRoomIdx, 0, movingRoom);
                dragSourceGroupIndex = null; dragSourceRoomIndex = null;
                await renderDashboard(true, false);
            }
        }

        async function deleteGroupToTrash(gIdx) {
            if (!checkPermission()) return;
            let activeData = myData[selectedYear] || [];
            let targetGroup = activeData[gIdx];
            
            if (confirm(`⚠️ 確定要刪除整個社區「${targetGroup.groupName}」嗎？\n\n內含的 ${targetGroup.rooms.length} 間房間財務資料將精準移入垃圾桶。`)) {
                targetGroup.deletedFromYear = selectedYear;
                if (!myData["trash_bin"]) myData["trash_bin"] = [];
                myData["trash_bin"].push(targetGroup);
                activeData.splice(gIdx, 1);
                await renderDashboard(true, true);
            }
        }

        async function deleteRoomToTrash(gIdx, rIdx) {
            if (!checkPermission()) return;
            let activeData = myData[selectedYear] || [];
            let originalGroupName = activeData[gIdx].groupName;
            let targetRoom = activeData[gIdx].rooms[rIdx];

            if (confirm(`🚪 確定要將 ${targetRoom.number} 室移至垃圾桶嗎？\n(歷史收租紀錄與事件紀錄皆會完整封裝保留)`)) {
                if (!myData["room_trash_bin"]) myData["room_trash_bin"] = [];
                
                myData["room_trash_bin"].push({
                    deletedFromYear: selectedYear,
                    originalGroupName: originalGroupName,
                    roomData: targetRoom
                });

                activeData[gIdx].rooms.splice(rIdx, 1);
                await renderDashboard(true, false);
                alert(`🛒 已成功將 ${targetRoom.number} 室移至下方的垃圾桶暫存區！`);
            }
        }

        async function deleteTrashItemPermanently(tIdx) {
            if (!checkPermission()) return;
            if (confirm("🔥 警告：此操作將永久粉碎該社區，無法再還原！確定繼續？")) {
                myData["trash_bin"].splice(tIdx, 1);
                await renderDashboard(true, false);
            }
        }

        async function deleteRoomTrashPermanently(rIdx) {
            if (!checkPermission()) return;
            if (confirm("🔥 確定要永久粉碎這間房間的所有財務資料嗎？")) {
                myData["room_trash_bin"].splice(rIdx, 1);
                await renderDashboard(true, false);
            }
        }

        async function clearAllTrash() {
            if (!checkPermission()) return;
            if (confirm("💥 確定要清空垃圾桶嗎？這將粉碎裡面所有的歷史紀錄！")) {
                myData["trash_bin"] = [];
                myData["room_trash_bin"] = [];
                await renderDashboard(true, false);
            }
        }

        async function restoreGroupFromTrash(tIdx) {
            if (!checkPermission()) return;
            let restoredGroup = myData["trash_bin"].splice(tIdx, 1)[0];
            let targetYear = restoredGroup.deletedFromYear || selectedYear;
            if (!myData[targetYear]) myData[targetYear] = [];
            
            myData[targetYear].push({
                groupName: restoredGroup.groupName,
                rooms: restoredGroup.rooms || []
            });
            
            alert(`↩️ 已還原社區「${restoredGroup.groupName}」至 ${targetYear} 年度！`);
            selectedYear = targetYear;
            document.getElementById("yearSelect").value = selectedYear;
            await renderDashboard(true, true);
        }

        async function restoreRoomFromTrash(rIdx) {
            if (!checkPermission()) return;
            let package = myData["room_trash_bin"].splice(rIdx, 1)[0];
            let targetYear = package.deletedFromYear || selectedYear;
            
            if (!myData[targetYear]) myData[targetYear] = [];
            let activeData = myData[targetYear];

            let groupObj = activeData.find(g => g.groupName === package.originalGroupName);
            if (!groupObj) {
                groupObj = { groupName: package.originalGroupName, rooms: [] };
                activeData.push(groupObj);
            }

            groupObj.rooms.push(package.roomData);
            alert(`↩️ 成功將 ${package.roomData.number} 室 還原至 【${targetYear}年 - ${package.originalGroupName}】！`);
            
            selectedYear = targetYear;
            document.getElementById("yearSelect").value = selectedYear;
            await renderDashboard(true, true);
        }

        async function changePaidDate(gIdx, rIdx, bIdx) {
            if (!checkPermission()) return;
            let bill = myData[selectedYear][gIdx].rooms[rIdx].bills[bIdx];
            let newDate = prompt("請輸入入帳日期：\n(支援簡寫如 2603 代表 2026 年 3 月)", bill.paidDate || "");
            if (newDate === null) return;
            bill.paidDate = newDate.trim();
            await renderDashboard(true, false); 
        }

        function addCustomBillItem() {
            let name = document.getElementById("customName").value, amt = document.getElementById("customAmount").value;
            if (!name || !amt) return alert("請填寫項目名稱與金額！");
            tempCustomBills.push({ name, amount: Number(amt) });
            document.getElementById("customListVisual").innerHTML = tempCustomBills.map(item => `<li>${item.name}: (每月 +${item.amount.toLocaleString()})</li>`).join("");
            document.getElementById("customName").value = ""; document.getElementById("customAmount").value = "";
        }

        function openGroupModal() { 
            if (!checkPermission()) return;
            document.getElementById("groupModalTitle").innerText = "📍 新增社區群組";
            document.getElementById("submitGroupBtn").innerText = "確定建立";
            document.getElementById("editGroupIndexFlag").value = ""; 
            document.getElementById("inputGroupName").value = "";
            document.getElementById("groupModal").style.display = "flex"; 
        }

        function openEditGroupModal(gIdx) {
            if (!checkPermission()) return;
            document.getElementById("groupModalTitle").innerText = "✏️ 編輯社區名稱";
            document.getElementById("submitGroupBtn").innerText = "儲存修改";
            document.getElementById("editGroupIndexFlag").value = gIdx; 
            document.getElementById("inputGroupName").value = myData[selectedYear][gIdx].groupName;
            document.getElementById("groupModal").style.display = "flex";
        }

        function closeGroupModal() { document.getElementById("groupModal").style.display = "none"; }
        
        function openRoomModal() {
            if (!checkPermission()) return;
            let activeData = myData[selectedYear] || [];
            if (!activeData.length) return alert("請先建立社區群組！");
            document.getElementById("selectGroup").innerHTML = activeData.map((g, i) => `<option value="${i}">${g.groupName}</option>`).join("");
            document.getElementById("roomModalTitle").innerText = "🚪 新增房源與財務設定";
            document.getElementById("submitRoomBtn").innerText = "確認新增";
            document.getElementById("editGroupIndex").value = ""; document.getElementById("editRoomIndex").value = "";
            
            document.getElementById("utilityCalculatorWrapper").style.display = "block";
            document.getElementById("customBillSectionWrapper").style.display = "block";
            
            tempCustomBills = []; document.getElementById("customListVisual").innerHTML = "";
            document.getElementById("inputRoomNumber").value = ""; document.getElementById("inputTenant").value = "";
            document.getElementById("inputMemo").value = ""; document.getElementById("inputRent").value = "12000";
            document.getElementById("inputDeposit").value = "24000"; document.getElementById("inputManage").value = "0";
            document.getElementById("inputParking").value = "0"; document.getElementById("inputPet").value = "0";
            document.getElementById("calcPrev").value = ""; document.getElementById("calcCurr").value = "";
            document.getElementById("calcName").value = "電費"; document.getElementById("calcRate").value = "5";
            document.getElementById("customName").value = ""; document.getElementById("customAmount").value = "";
            
            document.getElementById("roomModal").style.display = "flex";
        }

        function openEditRoomModal(gIdx, rIdx) {
            if (!checkPermission()) return;
            let room = myData[selectedYear][gIdx].rooms[rIdx];
            openRoomModal(); 
            document.getElementById("roomModalTitle").innerText = `✏️ 編輯 🚪 ${room.number} 室 房源`;
            document.getElementById("submitRoomBtn").innerText = "儲存修改";
            document.getElementById("editGroupIndex").value = gIdx; document.getElementById("editRoomIndex").value = rIdx;
            
            document.getElementById("calcPrev").value = ""; 
            document.getElementById("calcCurr").value = "";
            document.getElementById("customName").value = "";
            document.getElementById("customAmount").value = "";
            
            document.getElementById("utilityCalculatorWrapper").style.display = "none";
            document.getElementById("customBillSectionWrapper").style.display = "none";
            
            document.getElementById("selectGroup").value = gIdx;
            document.getElementById("inputRoomNumber").value = room.number; document.getElementById("inputTenant").value = room.tenant;
            document.getElementById("inputPeriod").value = room.rentPeriod; document.getElementById("inputMemo").value = room.memo || "";
            document.getElementById("inputRent").value = room.rent || 12000; document.getElementById("inputDeposit").value = room.deposit !== undefined ? room.deposit : 24000;
            document.getElementById("inputManage").value = room.manage || 0; document.getElementById("inputParking").value = room.parking || 0;
            document.getElementById("inputPet").value = room.pet || 0;
        }

        function closeRoomModal() { document.getElementById("roomModal").style.display = "none"; }

        async function submitGroup() {
            if (!checkPermission()) return;
            let name = document.getElementById("inputGroupName").value;
            if(!name) return alert("請輸入名稱");
            let flag = document.getElementById("editGroupIndexFlag").value;
            if (!myData[selectedYear]) myData[selectedYear] = [];
            
            if (flag !== "") { myData[selectedYear][flag].groupName = name; } else { myData[selectedYear].push({ groupName: name, rooms: [] }); }
            closeGroupModal();
            await renderDashboard(true, true); 
        }

        async function submitRoom() {
            if (!checkPermission()) return;
            
            let gIdx = document.getElementById("selectGroup").value;
            let num = document.getElementById("inputRoomNumber").value;
            if(!num) return alert("請輸入房號");
            
            let tenant = document.getElementById("inputTenant").value || "待租中";
            let rent = Number(document.getElementById("inputRent").value);
            let deposit = Number(document.getElementById("inputDeposit").value);
            let period = document.getElementById("inputPeriod").value;
            let memo = document.getElementById("inputMemo").value;
            let manage = Number(document.getElementById("inputManage").value) || 0;
            let parking = Number(document.getElementById("inputParking").value) || 0;
            let pet = Number(document.getElementById("inputPet").value) || 0;

            let oldGIdx = document.getElementById("editGroupIndex").value;
            let oldRIdx = document.getElementById("editRoomIndex").value;
            let isEdit = oldGIdx !== "" && oldRIdx !== "";

            let monthlyTotal = rent + manage + parking + pet;
            let details = [`基本租金: $${rent.toLocaleString()}`];
            if (manage > 0) details.push(`管理費: $${manage.toLocaleString()}`);
            if (parking > 0) details.push(`車位費: $${parking.toLocaleString()}`);
            if (pet > 0) details.push(`寵物費: $${pet.toLocaleString()}`);

            let customTotal = 0;
            if (isEdit) {
                customTotal = myData[selectedYear][oldGIdx].rooms[oldRIdx].customTotal || 0;
                monthlyTotal += customTotal;
                let oldCustom = (myData[selectedYear][oldGIdx].rooms[oldRIdx].details || []).filter(d => !d.includes("基本租金") && !d.includes("管理費") && !d.includes("車位費") && !d.includes("寵物費"));
                details = details.concat(oldCustom);
            } else {
                tempCustomBills.forEach(item => {
                    monthlyTotal += item.amount; customTotal += item.amount;
                    details.push(`${item.name}: $${item.amount.toLocaleString()}`);
                });
            }

            let bills = [];
            if (deposit > 0) {
                let oldDepDate = isEdit ? (myData[selectedYear][oldGIdx].rooms[oldRIdx].bills.find(b => b.name.includes("押金"))?.paidDate || "") : "";
                bills.push({ name: "🤝 房屋押金", amount: deposit, paidDate: oldDepDate });
            }

            let leaseMonths = generateLeaseMonths(period);
            for (let i = 0; i < 12; i++) {
                let mName = leaseMonths[i]; 
                let oldDate = isEdit ? (myData[selectedYear][oldGIdx].rooms[oldRIdx].bills.find(b => b.name === mName)?.paidDate || "") : "";
                bills.push({ name: mName, amount: monthlyTotal, paidDate: oldDate });
            }

            let repairs = isEdit ? (myData[selectedYear][oldGIdx].rooms[oldRIdx].repairs || []) : [];
            let roomObj = { number: num, tenant, rentPeriod: period, memo, rent, deposit, manage, parking, pet, customTotal, details, bills, repairs };

            if (isEdit) {
                if (oldGIdx != gIdx) { 
                    myData[selectedYear][oldGIdx].rooms.splice(oldRIdx, 1); 
                    myData[selectedYear][gIdx].rooms.push(roomObj); 
                } else { 
                    myData[selectedYear][gIdx].rooms[oldRIdx] = roomObj; 
                }
            } else { 
                myData[selectedYear][gIdx].rooms.push(roomObj); 
            }

            closeRoomModal();
            // 關鍵修正：確實等待 renderDashboard（包含內部的雲端 saveToCloud）執行完畢再結束，不留非同步懸空漏洞
            await renderDashboard(true, false); 
        }
    </script>
</body>
</html>
