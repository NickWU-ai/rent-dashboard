<!DOCTYPE html>
<html>
<head>
    <title>物業資產財務管理系統 🏢</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; padding: 40px; color: #1e293b; margin: 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #0f172a; margin: 0; font-size: 28px; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 5px; }
        .btn { padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; transition: background 0.2s; }
        .btn-primary { background-color: #2563eb; color: white; }
        .group-section { background-color: #ffffff; border-radius: 16px; padding: 25px; margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .group-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px; }
        .group-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; }
        .group-edit-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .group-edit-btn:hover { background-color: #eff6ff; }
        
        /* RWD 彈性網格佈局 */
        .card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        /* 房源卡片與到期警告樣式 */
        .room-card { background-color: #f8fafc; border-radius: 12px; padding: 20px; position: relative; border: 1px solid #e2e8f0; transition: all 0.2s; box-sizing: border-box; }
        .room-card.expiry-warning { border: 2px solid #f97316 !important; background-color: #fff7ed !important; }
        .expiry-badge { background-color: #ffedd5; color: #ea580c; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; display: inline-block; border: 1px solid #fed7aa; }
        
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
        .delete-btn { color: #ef4444; }
        .edit-btn { color: #2563eb; }
        .room-number { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .info-text { font-size: 13px; color: #64748b; margin-bottom: 6px; }
        .memo-badge { background-color: #fffbeb; color: #b45309; border: 1px dashed #fde68a; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 8px; margin-bottom: 4px; line-height: 1.4; word-break: break-all; }
        .ledger-box { background-color: #ffffff; border-radius: 8px; padding: 12px; margin-top: 15px; border: 1px solid #edf2f7; }
        .ledger-title { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .bill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .bill-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #f8fafc; padding: 6px; border-radius: 6px; }
        .extra-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #eff6ff; padding: 7px 10px; border-radius: 6px; border: 1px solid #bfdbfe; color: #1e40af; }
        .memo-text { font-size: 11px; color: #64748b; padding-left: 20px; line-height: 1.4; margin: 0 0 10px 0; }
        
        .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; user-select: none; text-align: center; min-width: 45px; display: inline-block; }
        .status-paid { background-color: #dcfce7; color: #15803d; }
        .status-unpaid { background-color: #fee2e2; color: #b91c1c; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; display: none; z-index: 1000; }
        .modal-box { background-color: white; padding: 30px; border-radius: 16px; width: 460px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .custom-item-box { background-color: #f1f5f9; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        .custom-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .custom-list { font-size: 12px; color: #475569; margin-top: 5px; padding-left: 20px; margin-bottom: 0; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        #sync-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); display: none; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; color: #2563eb; z-index: 9999; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 垃圾桶專用樣式 */
        .trash-section { background-color: #fef2f2; border: 1px dashed #fee2e2; border-radius: 16px; padding: 25px; margin-top: 40px; }
        .trash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fee2e2; padding-bottom: 12px; margin-bottom: 20px; color: #991b1b; }
        .trash-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #fee2e2; font-size: 14px; }

        @media (max-width: 768px) {
            body { padding: 15px; }
            .header-container { flex-direction: column; align-items: flex-start; gap: 15px; }
            .header-container div:last-child { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
            .btn { flex: 1 1 45%; text-align: center; padding: 12px 10px; font-size: 13px; }
            .top-grid { grid-template-columns: 1fr !important; gap: 15px; }
            .top-grid > div { height: auto !important; }
            .toolbar-container { flex-direction: column; align-items: stretch !important; gap: 12px; }
            .toolbar-container .controls-wrapper { flex-direction: column; align-items: stretch !important; gap: 10px; }
            .toolbar-container .control-item { width: 100%; justify-content: space-between; }
            .toolbar-container select { flex: 1; max-width: 60%; box-sizing: border-box; }
            .toolbar-container button { width: 100%; }
            .card-container { grid-template-columns: 1fr !important; }
            .modal-box { width: 95%; padding: 20px; }
            .form-row-grid { grid-template-columns: 1fr; gap: 0; }
            .status-badge { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="sync-overlay">
        <div class="spinner"></div>
        <div id="sync-overlay-text">⏳ 資料儲存至雲端中，請稍候...</div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="cloud-form" method="POST" action="https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="jsonString" id="formJsonField">
    </form>

    <div class="header-container">
        <div>
            <h1>物業資產財務管理系統 🏢</h1>
            <div class="subtitle" id="connection-status">🟢 系統載入中...</div>
        </div>
        <div>
            <button class="btn" id="viewerBtn" style="background-color: #0ea5e9; color: white;" onclick="toggleViewMode()">👁️ 完整閱覽登入</button>
            <button class="btn" id="adminBtn" style="background-color: #475569; color: white;" onclick="toggleAdminMode()">🔐 管理員登入</button>
            <button class="btn" id="headerSync" style="background-color: #64748b; color: white;" onclick="forceDownloadFromCloud()">🔄 雲端同步</button>
            <button class="btn" id="backupBtn" style="background-color: #f59e0b; color: white;" onclick="downloadBackup()">📥 下載備份</button>
            <button class="btn btn-primary" id="headerAddGroup" onclick="openGroupModal()">＋ 新增社區</button>
            <button class="btn btn-primary" id="headerAddRoom" style="background-color: #10b981;" onclick="openRoomModal()">＋ 新增房源</button>
        </div>
    </div>
    
    <div id="topFinancialGrid" class="top-grid" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 25px;">
        <div id="dashboard-zone" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;"></div>
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; height: 230px; box-sizing: border-box;">
            <div style="font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 10px;">📊 年度歷史實收租金趨勢</div>
            <div style="height: 160px; position: relative;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>

    <div class="toolbar-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
        <div class="controls-wrapper" style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <div class="control-item" style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 14px; font-weight: 700; color: #1e293b;">📅 選擇年度：</span>
                <select id="yearSelect" onchange="handleYearChange(this.value)" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #ffffff; color:#2563eb; font-weight:700;">
                    <option value="2025">2025 年</option>
                    <option value="2026">2026 年</option>
                    <option value="2027">2027 年</option>
                    <option value="2028">2028 年</option>
                    <option value="2029">2029 年</option>
                    <option value="2030">2030 年</option>
                    <option value="2031">2031 年</option>
                    <option value="2032">2032 年</option>
                    <option value="2033">2033 年</option>
                    <option value="2034">2034 年</option>
                    <option value="2035">2035 年</option>
                    <option value="2036">2036 年</option>
                </select>
            </div>
            <div class="control-item" style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 14px; font-weight: 600; color: #475569;">🔍 篩選條件：</span>
                <select id="filterSelect" onchange="handleFilterChange(this.value)" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #f8fafc; color:#1e293b; font-weight:600;">
                    <option value="all">1. 全部房源</option>
                    <option value="vacant">2. 有房間但沒租約 (待租中房源)</option>
                    <option value="unpaid">3. 未繳租金</option>
                    <optgroup label="4. 房屋群組 (單獨社區顯示)" id="dropdownGroupSection"></optgroup>
                </select>
            </div>
        </div>
        <button id="exportBtn" class="btn" style="background-color: #16a34a; color: white;" onclick="exportToCSV()">📊 匯出本月 Excel 報表</button>
    </div>
    
    <div id="group-zone"></div>

    <div id="trash-zone" class="trash-section" style="display: none;">
        <div class="trash-header">
            <h3 style="margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px;">🗑️ 垃圾桶暫存區 (安全防誤刪機制)</h3>
            <span style="font-size: 12px; color: #ef4444;">* 僅管理員可看到並進行還原或徹底銷毀</span>
        </div>
        <div id="trash-list-container"></div>
    </div>

    <div class="modal-overlay" id="groupModal">
        <div class="modal-box">
            <div class="modal-title" id="groupModalTitle">📍 新增社區群組</div>
            <input type="hidden" id="editGroupIndexFlag" value="">
            <div class="form-group">
                <label>社區/街道名稱</label>
                <input type="text" id="inputGroupName" placeholder="例如：福中街">
            </div>
            <div class="modal-buttons">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeGroupModal()">取消</button>
                <button class="btn btn-primary" id="submitGroupBtn" onclick="submitGroup()">確定建立</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="roomModal">
        <div class="modal-box">
            <div class="modal-title" id="roomModalTitle">🚪 新增房源與財務設定</div>
            <input type="hidden" id="editGroupIndex" value="">
            <input type="hidden" id="editRoomIndex" value="">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>隸屬社區</label>
                    <select id="selectGroup"></select>
                </div>
                <div class="form-group">
                    <label>房間號碼</label>
                    <input type="text" id="inputRoomNumber" placeholder="例如：102">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>租客姓名</label>
                    <input type="text" id="inputTenant" placeholder="Example: 林小華">
                </div>
                <div class="form-group">
                    <label>租合約期</label>
                    <input type="text" id="inputPeriod" value="2026/06 ~ 2027/05" placeholder="格式範例: 2026/06 ~ 2027/05">
                </div>
            </div>
            <div class="form-group">
                <label>📝 房源備註事項</label>
                <input type="text" id="inputMemo" placeholder="例如：冷氣剛換新、車位在B2...">
            </div>

            <div class="form-group">
                <label>⚡ 獨立水電費計算機 (自動匯入臨時特殊月費)</label>
                <div class="custom-item-box" style="background-color: #f0fdf4; border-color: #bbf7d0; margin-bottom: 10px;">
                    <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 6px; margin-bottom: 8px;">
                        <input type="text" id="calcName" value="電費" style="padding:6px;">
                        <input type="number" id="calcPrev" placeholder="上次" style="padding:6px;">
                        <input type="number" id="calcCurr" placeholder="本次" style="padding:6px;">
                        <input type="number" id="calcRate" value="5" placeholder="單價" style="padding:6px;">
                    </div>
                    <button class="btn" style="background-color: #16a34a; color: white; width: 100%; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 4px;" onclick="calculateUtility()">🧮 計算並匯入下方項目</button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 15px 0;">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>💰 每月基本租金</label>
                    <input type="number" id="inputRent" value="12000">
                </div>
                <div class="form-group">
                    <label>🤝 單次房屋押金</label>
                    <input type="number" id="inputDeposit" value="24000">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>🛡️ 每月管理費</label>
                    <input type="number" id="inputManage" value="0">
                </div>
                <div class="form-group">
                    <label>🚗 每月車位費</label>
                    <input type="number" id="inputParking" value="0">
                </div>
            </div>
            <div class="form-group">
                <label>🐾 每月寵物清潔費</label>
                <input type="number" id="inputPet" value="0">
            </div>
            <div class="form-group">
                <label>✍️ 其他臨時特殊月費</label>
                <div class="custom-item-box" id="customItemBoxSection">
                    <div class="custom-input-group">
                        <input type="text" id="customName" placeholder="項目名稱" style="flex: 2;">
                        <input type="number" id="customAmount" placeholder="金額" style="flex: 1;">
                        <button class="btn btn-primary" style="padding: 0 12px; background-color: #475569;" onclick="addCustomBillItem()">＋加入</button>
                    </div>
                    <ul class="custom-list" id="customListVisual"></ul>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeRoomModal()">取消</button>
                <button class="btn btn-primary" style="background-color: #10b981;" id="submitRoomBtn" onclick="submitRoom()">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec";
        
        let isAdmin = false;
        let isFullView = false; 
        const ADMIN_PASSWORD = "2007"; 
        const VIEWER_PASSWORD = "5678"; 

        let myData = {}; 
        let selectedYear = "2026"; 
        let tempCustomBills = [];
        let currentFilter = 'all'; 
        let chartInstance = null;

        // 初始化本地儲存空間讀取
        try {
            let localData = localStorage.getItem("date_driven_landlord_data");
            if (localData && localData !== "[]" && localData !== "undefined") {
                let parsed = JSON.parse(localData);
                if (Array.isArray(parsed)) {
                    myData = {};
                    myData[selectedYear] = parsed;
                } else {
                    myData = parsed;
                }
            }
        } catch (e) { console.error("本地資料讀取異常", e); }

        if (!myData[selectedYear]) myData[selectedYear] = [];
        // 如果沒有垃圾桶資料庫，則初始化它
        if (!myData["trash_bin"]) myData["trash_bin"] = [];

        document.getElementById("yearSelect").value = selectedYear;

        function checkPermission() {
            if (!isAdmin) {
                alert("🔒 目前為「唯讀模式」，不允許執行此操作。\n若需使用，請先點擊網頁右上角的「管理員登入」。");
                return false;
            }
            return true;
        }

        function toggleViewMode() {
            if (isFullView) {
                isFullView = false;
                alert("已切換回「訪客看房模式」，系統將自動鎖定僅顯示待租中房源。");
            } else {
                let pass = prompt("🔑 請輸入閱覽者密碼以查看完整房源與財務資產：");
                if (pass === VIEWER_PASSWORD) {
                    isFullView = true;
                    alert("🔓 密碼正確！已解鎖完整房源瀏覽與報表檢視模式。");
                } else if (pass !== null) {
                    alert("❌ 密碼錯誤，保持訪客模式！");
                }
            }
            renderDashboard(false);
        }

        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                isFullView = false;
                alert("已登出管理員身分。系統切換回「訪客看房模式」。");
            } else {
                let pass = prompt("🔑 請輸入管理員密碼：");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    isFullView = true; 
                    alert("🔓 密碼正確！已開啟主控編輯權限。");
                } else if (pass !== null) {
                    alert("❌ 密碼錯誤，保持訪客模式！");
                }
            }
            renderDashboard(false);
        }

        function updateAuthUI() {
            const adminBtn = document.getElementById("adminBtn");
            const viewerBtn = document.getElementById("viewerBtn");
            const btnAddGroup = document.getElementById("headerAddGroup");
            const btnAddRoom = document.getElementById("headerAddRoom");
            const btnSync = document.getElementById("headerSync");
            const btnBackup = document.getElementById("backupBtn");
            const topFinancialGrid = document.getElementById("topFinancialGrid");
            const exportBtn = document.getElementById("exportBtn");
            const trashZone = document.getElementById("trash-zone");
            
            if (isAdmin) {
                adminBtn.innerHTML = "🔓 管理模式 (登出)";
                adminBtn.style.backgroundColor = "#dc2626";
                if(btnAddGroup) btnAddGroup.style.display = "inline-block";
                if(btnAddRoom) btnAddRoom.style.display = "inline-block";
                if(btnSync) btnSync.style.display = "inline-block";
                if(btnBackup) btnBackup.style.display = "inline-block";
                viewerBtn.style.display = "none";
                if(trashZone) trashZone.style.display = "block";
            } else {
                adminBtn.innerHTML = "🔐 管理員登入";
                adminBtn.style.backgroundColor = "#475569";
                if(btnAddGroup) btnAddGroup.style.display = "none";
                if(btnAddRoom) btnAddRoom.style.display = "none";
                if(btnSync) btnSync.style.display = "none";
                if(btnBackup) btnBackup.style.display = "none";
                viewerBtn.style.display = "inline-block";
                if(trashZone) trashZone.style.display = "none";
                
                if (isFullView) {
                    viewerBtn.innerHTML = "👁️ 模式：完整閱覽 (切回訪客)";
                    viewerBtn.style.backgroundColor = "#0284c7";
                } else {
                    viewerBtn.innerHTML = "👁️ 完整閱覽登入";
                    viewerBtn.style.backgroundColor = "#0ea5e9";
                }
            }

            if (isAdmin || isFullView) {
                if(topFinancialGrid) topFinancialGrid.style.display = "grid";
                if(exportBtn) exportBtn.style.display = "inline-block";
            } else {
                if(topFinancialGrid) topFinancialGrid.style.display = "none";
                if(exportBtn) exportBtn.style.display = "none";
            }
        }

        function generateLeaseMonths(periodStr) {
            let months = [];
            let defaultYear = parseInt(selectedYear) || new Date().getFullYear();
            let fallback = [];
            for(let i=1; i<=12; i++) {
                fallback.push(`${defaultYear}/${String(i).padStart(2, '0')}`);
            }
            if (!periodStr || !periodStr.includes("~")) return fallback;
            try {
                let parts = periodStr.split("~");
                let startPart = parts[0].trim();
                let startYM = startPart.split("/");
                let sYear = parseInt(startYM[0]);
                let sMonth = parseInt(startYM[1]);
                if(isNaN(sYear) || isNaN(sMonth)) return fallback;
                for(let i = 0; i < 12; i++) {
                    let currentMonth = sMonth + i;
                    let currentYear = sYear;
                    if (currentMonth > 12) {
                        currentYear += Math.floor((currentMonth - 1) / 12);
                        currentMonth = ((currentMonth - 1) % 12) + 1;
                    }
                    months.push(`${currentYear}/${String(currentMonth).padStart(2, '0')}`);
                }
                return months;
            } catch(e) { return fallback; }
        }

        function checkLeaseExpiry(periodStr) {
            if (!periodStr || !periodStr.includes("~")) return { warning: false, text: "" };
            try {
                let parts = periodStr.split("~");
                let endPart = parts[1].trim();
                let endYM = endPart.split("/");
                let endYear = parseInt(endYM[0]);
                let endMonth = parseInt(endYM[1]) - 1;
                let endDate = new Date(endYear, endMonth + 1, 0);
                let today = new Date();
                let timeDiff = endDate.getTime() - today.getTime();
                let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
                if (daysDiff < 0) return { warning: true, text: "⚠️ 租約已過期！" };
                if (daysDiff <= 45) return { warning: true, text: `⚠️ 租約剩 ${daysDiff} 天到期` };
            } catch(e) {}
            return { warning: false, text: "" };
        }

        function calculateUtility() {
            let name = document.getElementById("calcName").value || "電費";
            let prev = document.getElementById("calcPrev").value;
            let curr = document.getElementById("calcCurr").value;
            let rate = Number(document.getElementById("calcRate").value) || 5;
            if (prev === "" || curr === "") return alert("請輸入完整度數！");
            let pNum = Number(prev), cNum = Number(curr);
            if (cNum < pNum) return alert("本次度數不能小於上次度數喔！");
            let degrees = cNum - pNum;
            let total = degrees * rate;
            tempCustomBills.push({ name: `${name}(${degrees}度,${pNum}→${cNum})`, amount: total });
            document.getElementById("customListVisual").innerHTML = tempCustomBills.map(item => `<li>${item.name}: (每月 +${item.amount.toLocaleString()})</li>`).join("");
            document.getElementById("calcPrev").value = "";
            document.getElementById("calcCurr").value = "";
        }

        // 核心修改 3：垃圾桶暫存區內容的還原與永久刪除
        function restoreTrashItem(trashId) {
            if (!checkPermission()) return;
            let tIdx = myData["trash_bin"].findIndex(item => item.id === trashId);
            if (tIdx === -1) return;
            let item = myData["trash_bin"][tIdx];

            if (!myData[item.year]) myData[item.year] = [];

            if (item.type === "group") {
                myData[item.year].push(item.data);
                alert(`✅ 已成功還原整個社區群組「${item.originName}」至 ${item.year} 年度！`);
            } else if (item.type === "room") {
                // 尋找對應名稱的社區放回去，若不存在則建立新的
                let matchGroup = myData[item.year].find(g => g.groupName === item.originGroupName);
                if (!matchGroup) {
                    matchGroup = { groupName: item.originGroupName, rooms: [] };
                    myData[item.year].push(matchGroup);
                }
                matchGroup.rooms.push(item.data);
                alert(`✅ 已成功還原房源 ${item.data.number} 室至「${item.originGroupName}」中！`);
            }
            myData["trash_bin"].splice(tIdx, 1);
            renderDashboard(true, true);
        }

                                📍 ${g.groupName} 
                                ${isAdmin ? `<button class="group-edit-btn" onclick="openEditGroupModal(${gIdx}, '${g.groupName}')">✏️ 編輯</button>` : ''}
                                ${isAdmin ? `<button class="group-edit-btn" style="color:#ef4444;" onclick="deleteGroup(${gIdx})">🗑️ 刪除社區</button>` : ''}
                            </h2>
                            <span style="font-size:13px; color:#64748b; font-weight:bold;">共 ${g.rooms.length} 間房源</span>
                        </div>
                        <div class="card-container">
                `;

                let roomsRendered = 0;
                g.rooms.forEach((r, rIdx) => {
                    if (!isAdmin && !isFullView) {
                        if (r.tenant && r.tenant.trim() !== "") return;
                    }
                    if (currentFilter === 'vacant' && r.tenant && r.tenant.trim() !== "") return;
                    if (currentFilter === 'unpaid') {
                        let mBill = r.bills.find(b => b.name === curYM);
                        if (!mBill || (mBill.paidDate && mBill.paidDate.trim() !== "")) return;
                    }

                    roomsRendered++;
                    let expiry = checkLeaseExpiry(r.rentPeriod);
                    let mBill = r.bills.find(b => b.name === curYM);
                    let isPaid = mBill && mBill.paidDate && mBill.paidDate.trim() !== "";

                    groupHTML += `
                        <div class="room-card ${expiry.warning ? 'expiry-warning' : ''}">
                            ${isAdmin ? `
                            <div class="card-actions">
                                <button class="action-btn edit-btn" onclick="openEditRoomModal(${gIdx}, ${rIdx})">✏️</button>
                                <button class="action-btn delete-btn" onclick="deleteRoom(${gIdx}, ${rIdx})">🗑️</button>
                            </div>` : ''}
                            <div class="room-number">🚪 室號：${r.number}</div>
                            <div class="info-text">👤 租客姓名：<strong>${r.tenant || '<span style="color:#ea580c;">待租中 (暫無租約)</span>'}</strong></div>
                            <div class="info-text">📅 租約期間：${r.rentPeriod || '無'}</div>
                            ${expiry.warning ? `<div class="expiry-badge">${expiry.text}</div>` : ''}
                            ${r.memo ? `<div class="memo-badge">💬 ${r.memo}</div>` : ''}
                            
                            <div class="ledger-box">
                                <div class="ledger-title">
                                    <span>📅 本月財務帳本 (${curYM})</span>
                                    <span class="status-badge ${isPaid ? 'status-paid' : 'status-unpaid'}" 
                                          style="cursor:${isAdmin?'pointer':'default'};"
                                          onclick="toggleBillStatus(${gIdx}, ${rIdx}, '${curYM}')">
                                        ${isPaid ? '已入帳' : '未入帳'}
                                    </span>
                                </div>
                                <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700;">
                                    <span>應收總計:</span>
                                    <span style="color:#2563eb;">$${(mBill ? mBill.amount : 0).toLocaleString()} 元</span>
                                </div>
                                ${isPaid ? `<div style="font-size:11px; color:#16a34a; text-align:right; margin-top:4px;">入帳時間: ${mBill.paidDate}</div>` : ''}
                                ${(!isPaid && r.tenant && isAdmin) ? `
                                <button style="width:100%; margin-top:8px; padding:5px; font-size:11px; background:#eff6ff; border:1px solid #bfdbfe; color:#2563eb; border-radius:4px; cursor:pointer; font-weight:bold;"
                                        onclick="copyLineMessage('${r.tenant}','${r.number}','${curYM}租金費用', ${(mBill ? mBill.amount : 0)})">
                                    📋 複製 LINE 催繳文字
                                </button>` : ''}
                            </div>

                            <div style="margin-top:12px;">
                                <details style="font-size:12px; color:#475569;">
                                    <summary style="cursor:pointer; font-weight:600; padding:2px 0;">🔍 檢視 12 個月歷史合約帳單及修繕紀錄</summary>
                                    <div style="margin-top:6px; display:grid; grid-template-columns:1fr; gap:4px; background:white; padding:8px; border-radius:6px; border:1px solid #e2e8f0; max-height:160px; overflow-y:auto;">
                                        <div style="font-weight:bold; color:#0f172a; font-size:11px; border-bottom:1px solid #f1f5f9; padding-bottom:3px;">📅 合約期內帳單流水帳：</div>
                                        ${r.bills.map(b => {
                                            let bPaid = b.paidDate && b.paidDate.trim() !== "";
                                            return `<div style="display:flex; justify-content:space-between; font-size:11px; padding:2px 0;">
                                                <span>• ${b.name}: $${b.amount.toLocaleString()}</span>
                                                <span style="color:${bPaid?'#15803d':'#b91c1c'}; font-weight:bold;">${bPaid?'已收('+b.paidDate+')':'未收'}</span>
                                            </div>`;
                                        }).join("")}
                                        
                                        <div style="font-weight:bold; color:#0f172a; font-size:11px; border-bottom:1px solid #f1f5f9; padding-top:6px; padding-bottom:3px; display:flex; justify-content:between; align-items:center;">
                                            <span>🛠️ 修繕與特別事件紀錄：</span>
                                            ${isAdmin ? `<button onclick="addRepairLog(${gIdx}, ${rIdx})" style="font-size:9px; cursor:pointer; padding:1px 4px; background:#edf2f7; border:none; border-radius:3px;">+新增</button>` : ''}
                                        </div>
                                        ${(!r.repairs || r.repairs.length===0)?'<div style="color:#94a3b8; font-size:11px;">(暫無事件紀錄)</div>': r.repairs.map((rep, repIdx)=>`
                                            <div style="display:flex; justify-content:space-between; font-size:11px; background:#f8fafc; padding:4px; border-radius:4px; margin-bottom:2px;">
                                                <span>🛠️ ${rep.date} ${rep.name} (-$${rep.cost.toLocaleString()})</span>
                                                ${isAdmin ? `<span style="color:#ef4444; cursor:pointer;" onclick="deleteRepairLog(${gIdx}, ${rIdx}, ${repIdx})">❌</span>` : ''}
                                            </div>
                                        `).join("")}
                                    </div>
                                </details>
                            </div>
                        </div>
                    `;
                });

                groupHTML += `</div></div>`;
                if (isAdmin || isFullView || roomsRendered > 0) { gZone.innerHTML += groupHTML; }
            });

            renderTrashBinUI();
            drawChart();
            if (triggerCloudSave) saveToCloud();
        }

        function toggleBillStatus(gIdx, rIdx, billName) {
            if (!checkPermission()) return;
            let activeData = myData[selectedYear] || [];
            let r = activeData[gIdx].rooms[rIdx];
            let bill = r.bills.find(b => b.name === billName);
            if (!bill) return;

            if (bill.paidDate && bill.paidDate.trim() !== "") {
                if (confirm(`確定要將 ${r.number} 室的 ${billName} 帳單改回「未入帳」狀態嗎？`)) {
                    bill.paidDate = "";
                }
            } else {
                let today = new Date();
                let dateStr = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
                let customDate = prompt("請輸入入帳日期：", dateStr);
                if (customDate !== null) {
                    bill.paidDate = customDate.trim() === "" ? dateStr : customDate;
                }
            }
            renderDashboard(true, false);
        }

        // Modal 操作邏輯
        function openGroupModal() {
            if (!checkPermission()) return;
            document.getElementById("groupModalTitle").innerText = "📍 新增社區群組";
            document.getElementById("editGroupIndexFlag").value = "";
            document.getElementById("inputGroupName").value = "";
            document.getElementById("groupModal").style.display = "flex";
        }
        function openEditGroupModal(gIdx, oldName) {
            if (!checkPermission()) return;
            document.getElementById("groupModalTitle").innerText = "✏️ 修改社區群組名稱";
            document.getElementById("editGroupIndexFlag").value = gIdx;
            document.getElementById("inputGroupName").value = oldName;
            document.getElementById("groupModal").style.display = "flex";
        }
        function closeGroupModal() { document.getElementById("groupModal").style.display = "none"; }

        function submitGroup() {
            if (!checkPermission()) return;
            let name = document.getElementById("inputGroupName").value.trim();
            if (!name) return alert("名稱不可為空！");
            let activeData = myData[selectedYear] || [];
            let flag = document.getElementById("editGroupIndexFlag").value;

            if (flag === "") {
                activeData.push({ groupName: name, rooms: [] });
            } else {
                let idx = parseInt(flag);
                activeData[idx].groupName = name;
            }
            closeGroupModal();
            renderDashboard(true, true);
        }

        function openRoomModal() {
            if (!checkPermission()) return;
            let activeData = myData[selectedYear] || [];
            if (activeData.length === 0) return alert("請先建立至少一個社區群組！");
            
            document.getElementById("roomModalTitle").innerText = "🚪 新增房源與財務設定";
            document.getElementById("editGroupIndex").value = "";
            document.getElementById("editRoomIndex").value = "";
            
            let selectHTML = activeData.map((g, idx) => `<option value="${idx}">${g.groupName}</option>`).join("");
            document.getElementById("selectGroup").innerHTML = selectHTML;
            document.getElementById("selectGroup").disabled = false;
            
            document.getElementById("inputRoomNumber").value = "";
            document.getElementById("inputTenant").value = "";
            let nextYear = Number(selectedYear) + 1;
            document.getElementById("inputPeriod").value = `${selectedYear}/06 ~ ${nextYear}/05`;
            document.getElementById("inputMemo").value = "";
            document.getElementById("inputRent").value = 12000;
            document.getElementById("inputDeposit").value = 24000;
            document.getElementById("inputManage").value = 0;
            document.getElementById("inputParking").value = 0;
            document.getElementById("inputPet").value = 0;
            
            tempCustomBills = [];
            document.getElementById("customListVisual").innerHTML = "";
            document.getElementById("submitRoomBtn").innerText = "確認新增";
            document.getElementById("roomModal").style.display = "flex";
        }

        function openEditRoomModal(gIdx, rIdx) {
            if (!checkPermission()) return;
            let activeData = myData[selectedYear] || [];
            let r = activeData[gIdx].rooms[rIdx];
            
            document.getElementById("roomModalTitle").innerText = "✏️ 編輯房源與財務結構";
            document.getElementById("editGroupIndex").value = gIdx;
            document.getElementById("editRoomIndex").value = rIdx;
            
            let selectHTML = activeData.map((g, idx) => `<option value="${idx}">${g.groupName}</option>`).join("");
            document.getElementById("selectGroup").innerHTML = selectHTML;
            document.getElementById("selectGroup").value = gIdx;
            document.getElementById("selectGroup").disabled = false;
            
            document.getElementById("inputRoomNumber").value = r.number;
            document.getElementById("inputTenant").value = r.tenant || "";
            document.getElementById("inputPeriod").value = r.rentPeriod || "";
            document.getElementById("inputMemo").value = r.memo || "";
            document.getElementById("inputRent").value = r.rent || 0;
            document.getElementById("inputDeposit").value = r.deposit || 0;
            document.getElementById("inputManage").value = r.manage || 0;
            document.getElementById("inputParking").value = r.parking || 0;
            document.getElementById("inputPet").value = r.pet || 0;
            
            tempCustomBills = r.details ? [...r.details] : [];
            document.getElementById("customListVisual").innerHTML = tempCustomBills.map(item => `<li>${item.name}: (每月 +${item.amount.toLocaleString()})</li>`).join("");
            document.getElementById("submitRoomBtn").innerText = "儲存修改";
            document.getElementById("roomModal").style.display = "flex";
        }

        function closeRoomModal() { document.getElementById("roomModal").style.display = "none"; }

        function addCustomBillItem() {
            let name = document.getElementById("customName").value.trim();
            let amt = Number(document.getElementById("customAmount").value);
            if (!name || isNaN(amt)) return alert("請正確輸入特殊項目與金額！");
            tempCustomBills.push({ name, amount: amt });
            document.getElementById("customListVisual").innerHTML = tempCustomBills.map(item => `<li>${item.name}: (每月 +${item.amount.toLocaleString()})</li>`).join("");
            document.getElementById("customName").value = "";
            document.getElementById("customAmount").value = "";
        }

        function submitRoom() {
            if (!checkPermission()) return;
            let gIdx = parseInt(document.getElementById("selectGroup").value);
            let num = document.getElementById("inputRoomNumber").value.trim();
            let tenant = document.getElementById("inputTenant").value.trim();
            let period = document.getElementById("inputPeriod").value.trim();
            let memo = document.getElementById("inputMemo").value.trim();
            let rent = Number(document.getElementById("inputRent").value) || 0;
            let deposit = Number(document.getElementById("inputDeposit").value) || 0;
            let manage = Number(document.getElementById("inputManage").value) || 0;
            let parking = Number(document.getElementById("inputParking").value) || 0;
            let pet = Number(document.getElementById("inputPet").value) || 0;

            if (!num) return alert("房間號碼為必填欄位！");

            let customTotal = tempCustomBills.reduce((acc, cur) => acc + cur.amount, 0);
            let monthlyTotal = rent + manage + parking + pet + customTotal;
            let details = [...tempCustomBills];

            let isEdit = document.getElementById("editRoomIndex").value !== "";
            let oldGIdx = parseInt(document.getElementById("editGroupIndex").value);
            let oldRIdx = parseInt(document.getElementById("editRoomIndex").value);

            let bills = [];
            if (isEdit) {
                bills = [...myData[selectedYear][oldGIdx].rooms[oldRIdx].bills];
            } else {
                let leaseMonths = generateLeaseMonths(period);
                for (let i = 0; i < 12; i++) {
                    bills.push({ name: leaseMonths[i], amount: monthlyTotal, paidDate: "" });
                }
            }

            // 如果更新了合約或金額，做智慧同步
            if (isEdit) {
                let oldPeriod = myData[selectedYear][oldGIdx].rooms[oldRIdx].rentPeriod;
                let oldTotal = myData[selectedYear][oldGIdx].rooms[oldRIdx].rent + 
                               myData[selectedYear][oldGIdx].rooms[oldRIdx].manage + 
                               myData[selectedYear][oldGIdx].rooms[oldRIdx].parking + 
                               myData[selectedYear][oldGIdx].rooms[oldRIdx].pet + 
                               myData[selectedYear][oldGIdx].rooms[oldRIdx].customTotal;

                if (period !== oldPeriod || monthlyTotal !== oldTotal) {
                    if (confirm("📅 偵測到租約期間或每月應繳總額有變動！\n\n是否要重新初始化這 12 個月的月帳單？\n(確認後將覆蓋舊有的入帳日期，取消則保留舊帳單結構)")) {
                        bills = [];
                        let leaseMonths = generateLeaseMonths(period);
                        for (let i = 0; i < 12; i++) {
                            bills.push({ name: leaseMonths[i], amount: monthlyTotal, paidDate: "" });
                        }
                    }
                }
            }

            let repairs = isEdit ? (myData[selectedYear][oldGIdx].rooms[oldRIdx].repairs || []) : [];
            let roomObj = { number: num, tenant, rentPeriod: period, memo, rent, deposit, manage, parking, pet, customTotal, details, bills, repairs };

            if (isEdit) {
                if (oldGIdx != gIdx) {
                    myData[selectedYear][oldGIdx].rooms.splice(oldRIdx, 1);
                    myData[selectedYear][gIdx].rooms.push(roomObj);
                } else {
                    myData[selectedYear][gIdx].rooms[oldRIdx] = roomObj;
                }
            } else {
                myData[selectedYear][gIdx].rooms.push(roomObj);
            }

            renderDashboard(true, false); 
            closeRoomModal();
        }

        // 當系統第一次加載完成
        window.onload = function() {
            renderDashboard(false, true);
        };
    </script>
</body>
</html>
