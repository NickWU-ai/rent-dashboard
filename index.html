<!DOCTYPE html>
<html>
<head>
    <title>物業資產財務管理系統 🏢</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; padding: 20px; color: #1e293b; margin: 0; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #0f172a; margin: 0; font-size: 24px; }
        .subtitle { color: #64748b; font-size: 13px; margin-top: 5px; }
        .btn-wrapper { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn { padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; transition: background 0.2s; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background-color: #2563eb; color: white; }
        
        .group-section { background-color: #ffffff; border-radius: 16px; padding: 20px; margin-bottom: 25px; border: 1px solid #e2e8f0; width: 100%; display: block !important; }
        .group-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .group-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; color: #0f172a; }
        .group-edit-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px; }
        .group-edit-btn:hover { background-color: #eff6ff; }
        
        .card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; }
        
        /* 房源卡片基礎 */
        .room-card { background-color: #f8fafc; border-radius: 12px; padding: 18px; position: relative; border: 1px solid #e2e8f0; transition: all 0.2s; overflow: hidden; width: 100%; }
        .room-card.expiry-warning { border: 2px solid #f97316 !important; background-color: #fff7ed !important; }
        
        /* 🏠 招租公開頁風格卡片 */
        .room-card.public-showcase { background-color: #ffffff !important; border: 1px solid #e2e8f0 !important; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 0 !important; display: flex; flex-direction: column; }
        .public-img-container { width: 100%; height: 220px; background-color: #f1f5f9; position: relative; border-bottom: 1px solid #e2e8f0; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .public-img-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .public-badge { position: absolute; top: 12px; left: 12px; background: #10b981; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; z-index: 5; }
        .public-content { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .public-tag-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .public-tag { background: #f1f5f9; color: #475569; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
        .public-price { font-size: 17px; font-weight: 800; color: #2563eb; margin-top: 12px; border-top: 1px solid #f1f5f9; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; }
        .public-edit-trigger { font-size: 11px; color: #475569; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: normal; }
        .public-edit-trigger:hover { background: #e2e8f0; }

        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
        .delete-btn { color: #ef4444; }
        .edit-btn { color: #2563eb; }
        .renew-btn { color: #10b981; font-weight: bold; font-size: 13px; border: 1px solid #10b981; padding: 1px 5px; border-radius: 4px; background: white; transition: background 0.2s; }
        .renew-btn:hover { background: #ecfdf5; }
        
        .room-number { font-size: 17px; font-weight: 700; margin-bottom: 12px; color: #0f172a; padding-right: 90px; }
        .info-text { font-size: 13px; color: #64748b; margin-bottom: 6px; word-break: break-all; }
        .memo-badge { background-color: #fffbeb; color: #b45309; border: 1px dashed #fde68a; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 8px; margin-bottom: 4px; line-height: 1.4; word-break: break-all; }
        
        .ledger-box { background-color: #ffffff; border-radius: 8px; padding: 12px; margin-top: 15px; border: 1px solid #edf2f7; width: 100%; }
        .ledger-title { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .bill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; width: 100%; }
        .bill-row { display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; font-size: 11px; background: #f8fafc; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0; gap: 4px; text-align: center; }
        .bill-row span { font-weight: 500; color: #475569; }
        .extra-row { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font-size: 11px; background: #eff6ff; padding: 6px 8px; border-radius: 6px; border: 1px solid #bfdbfe; color: #1e40af; }
        
        .status-badge { padding: 4px; border-radius: 4px; font-size: 11px; font-weight: 600; user-select: none; text-align: center; display: block; cursor: pointer; width: 100%; }
        .status-paid { background-color: #dcfce7; color: #15803d; }
        .status-unpaid { background-color: #fee2e2; color: #b91c1c; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; display: none; z-index: 1000; padding: 10px; }
        .modal-box { background-color: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        #sync-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: none; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; color: #2563eb; z-index: 9999; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            body { padding: 10px; }
            h1 { font-size: 18px; text-align: center; width: 100%; }
            .header-container { justify-content: center; margin-bottom: 15px; gap: 10px; }
            .btn-wrapper { justify-content: center; width: 100%; gap: 6px; }
            .btn { padding: 8px 6px; font-size: 11px; flex: 1 1 calc(50% - 4px); text-align: center; }
            
            .top-grid { grid-template-columns: 1fr !important; gap: 10px !important; margin-bottom: 15px !important; }
            .top-grid > div:last-child { display: none !important; } 
            #dashboard-zone { grid-template-columns: 1fr !important; gap: 8px !important; }
            
            .toolbar-container { flex-direction: column !important; align-items: stretch !important; gap: 10px !important; padding: 12px !important; }
            .controls-wrapper { flex-direction: column !important; align-items: stretch !important; gap: 8px !important; width: 100%; }
            .control-item { display: flex; justify-content: space-between; align-items: center; width: 100%; }
            .control-item select { width: 65% !important; max-width: none !important; font-size: 13px; padding: 6px !important; }
            #exportBtn { width: 100%; text-align: center; padding: 10px; }
            
            #group-zone { display: flex; flex-direction: column; gap: 15px; width: 100%; }
            .group-section { padding: 12px; margin-bottom: 0px; width: 100%; }
            .card-container { grid-template-columns: 1fr !important; gap: 12px; width: 100%; }
            .bill-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)) !important; } 
            .form-row-grid { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

    <div id="sync-overlay">
        <div class="spinner"></div>
        <div id="sync-overlay-text">⏳ 資料儲存至雲端中...</div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="cloud-form" method="POST" action="https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="jsonString" id="formJsonField">
    </form>

    <div class="header-container">
        <div style="width: 100%; text-align: center;">
            <h1>物業資產財務管理系統 🏢</h1>
            <div class="subtitle" id="connection-status">🟢 系統載入中...</div>
        </div>
        <div class="btn-wrapper">
            <button class="btn" id="viewerBtn" style="background-color: #0ea5e9; color: white;" onclick="toggleViewMode()">👁️ 訪客招租公開頁</button>
            <button class="btn" id="adminBtn" style="background-color: #475569; color: white;" onclick="toggleAdminMode()">🔐 管理員登入</button>
            <button class="btn" id="headerSync" style="background-color: #64748b; color: white;" onclick="forceDownloadFromCloud()">🔄 雲端同步</button>
            <button class="btn" id="backupBtn" style="background-color: #f59e0b; color: white;" onclick="downloadBackup()">📥 下載備份</button>
            <button class="btn btn-primary" id="headerAddGroup" onclick="openGroupModal()">＋ 新增社區</button>
            <button class="btn btn-primary" id="headerAddRoom" style="background-color: #10b981;" onclick="openRoomModal()">＋ 新增房源</button>
        </div>
    </div>
    
    <div id="topFinancialGrid" class="top-grid" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 25px;">
        <div id="dashboard-zone" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;"></div>
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; height: 230px; box-sizing: border-box;">
            <div style="font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 10px;">📊 年度歷史實收租金趨勢</div>
            <div style="height: 160px; position: relative;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>

    <div class="toolbar-container" id="toolbarContainer" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
        <div class="controls-wrapper" style="display: flex; align-items: center; gap: 15px;">
            <div class="control-item" id="yearSelectWrapper">
                <span style="font-size: 14px; font-weight: 700; color: #1e293b;">📅 選擇年度：</span>
                <select id="yearSelect" onchange="handleYearChange(this.value)" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #ffffff; color:#2563eb; font-weight:700;">
                    <option value="2025">2025 年</option>
                    <option value="2026">2026 年</option>
                    <option value="2027">2027 年</option>
                    <option value="2028">2028 年</option>
                    <option value="2029">2029 年</option>
                    <option value="2030">2030 年</option>
                </select>
            </div>
            <div class="control-item">
                <span style="font-size: 14px; font-weight: 600; color: #475569;">🔍 篩選條件：</span>
                <select id="filterSelect" onchange="handleFilterChange(this.value)" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #f8fafc; color:#1e293b; font-weight:600;">
                    <option value="all">1. 全部房源</option>
                    <option value="vacant">2. 待租中房源 (對外招租)</option>
                    <option value="unpaid">3. 未繳租金</option>
                    <optgroup label="4. 房屋群組 (單獨社區)" id="dropdownGroupSection">
                    </optgroup>
                </select>
            </div>
        </div>
        <button id="exportBtn" class="btn" style="background-color: #16a34a; color: white;" onclick="exportToCSV()">📊 匯出本月 Excel 報表</button>
    </div>
    
    <div id="group-zone"></div>

    <!-- 社區設定彈出視窗 -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal-box">
            <div class="modal-title" id="groupModalTitle" style="font-weight:bold; font-size:16px;">📍 新增社區群組</div>
            <input type="hidden" id="editGroupIndexFlag" value="">
            <div class="form-group" style="margin-top:15px;">
                <label>社區/街道名稱</label>
                <input type="text" id="inputGroupName" placeholder="例如：福中街">
            </div>
            <div class="modal-buttons" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeGroupModal()">取消</button>
                <button class="btn btn-primary" id="submitGroupBtn" onclick="submitGroup()">確定建立</button>
            </div>
        </div>
    </div>

    <!-- 房源設定彈出視窗 -->
    <div class="modal-overlay" id="roomModal">
        <div class="modal-box">
            <div class="modal-title" id="roomModalTitle" style="font-weight:bold; font-size:16px;">🚪 房源設定與招租優化</div>
            <input type="hidden" id="editGroupIndex" value="">
            <input type="hidden" id="editRoomIndex" value="">
            <div class="form-row-grid" style="margin-top:15px;">
                <div class="form-group">
                    <label>隸屬社區</label>
                    <select id="selectGroup"></select>
                </div>
                <div class="form-group">
                    <label>房間號碼</label>
                    <input type="text" id="inputRoomNumber" placeholder="例如：102">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>租客姓名 (填「待租」即啟動公開招租頁)</label>
                    <input type="text" id="inputTenant" placeholder="例如：林小華">
                </div>
                <div class="form-group">
                    <label>📅 租約期/預計可租期</label>
                    <input type="text" id="inputPeriod" value="2026/06 ~ 2027/05" placeholder="格式: 2026/06 ~ 2027/05">
                </div>
            </div>
            <div class="form-group">
                <label>🖼️ 招租房間照片連結 (可直接貼上 Google 雲端硬碟共用連結)</label>
                <input type="text" id="inputRoomImg" placeholder="可直接貼上 https://drive.google.com/... 連結">
            </div>
            <div class="form-group">
                <label>🏷️ 房屋配套設備 (多選，用逗號隔開)</label>
                <input type="text" id="inputRoomTags" placeholder="冷氣, 雙人床, 獨立洗衣機, 陽台, 即可入住">
            </div>
            <div class="form-group">
                <label>📝 房源私密備註事項 (訪客模式將會隱藏)</label>
                <input type="text" id="inputMemo" placeholder="例如：冷氣去年剛換過...">
            </div>

            <div class="form-group" id="utilityCalculatorWrapper">
                <label>⚡ 獨立水電費計算機</label>
                <div style="background-color: #f0fdf4; border: 1px dashed #bbf7d0; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 4px; margin-bottom: 8px;">
                        <input type="text" id="calcName" value="電費" style="padding:4px; font-size:12px;">
                        <input type="number" id="calcPrev" placeholder="上次" style="padding:4px; font-size:12px;">
                        <input type="number" id="calcCurr" placeholder="本次" style="padding:4px; font-size:12px;">
                        <input type="number" id="calcRate" value="5" style="padding:4px; font-size:12px;">
                    </div>
                    <button class="btn" style="background-color: #16a34a; color: white; width: 100%; padding: 6px; font-size: 12px;" onclick="calculateUtility()">🧮 計算並匯入</button>
                    <ul id="customListVisual" style="font-size:11px; margin:5px 0 0 0; padding-left:15px; color:#166534;"></ul>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 12px 0;">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>💰 每月基本租金</label>
                    <input type="number" id="inputRent" value="12000">
                </div>
                <div class="form-group" id="depositFormGroup">
                    <label>🤝 單次房屋押金</label>
                    <input type="number" id="inputDeposit" value="24000">
                </div>
            </div>
            <div class="modal-buttons" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeRoomModal()">取消</button>
                <button class="btn btn-primary" style="background-color: #10b981;" id="submitRoomBtn" onclick="submitRoom()">確認儲存</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗：一鍵自動續約 -->
    <div class="modal-overlay" id="renewModal">
        <div class="modal-box">
            <div class="modal-title" style="font-size:16px; font-weight:700; color:#10b981; margin-bottom:15px;">🔄 一鍵自動智能續約</div>
            <input type="hidden" id="renewGIdx">
            <input type="hidden" id="renewRIdx">
            <div class="form-group">
                <label>房源與租客</label>
                <input type="text" id="renewTargetInfo" readonly style="background:#f1f5f9; color:#475569;">
            </div>
            <div class="form-group">
                <label>📅 系統自動推算下一期新約期 (12個月)</label>
                <input type="text" id="renewNewPeriod">
            </div>
            <div class="form-group">
                <label>💰 續約新月租金</label>
                <input type="number" id="renewNewRent">
            </div>
            <div class="modal-buttons" style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeRenewModal()">取消</button>
                <button class="btn" style="background-color:#10b981; color:white;" onclick="submitRenew()">確認一鍵續約</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec";
        
        let isAdmin = false;
        let isFullView = false; 
        const ADMIN_PASSWORD = "2007"; 

        let myData = {}; 
        let selectedYear = "2026"; 
        let tempCustomBills = [];
        let currentFilter = 'all'; 
        let chartInstance = null;
        let isPublicEditing = false;

        // 🧠 核心轉換機制：自動重組網址字串
        function convertGoogleDriveLink(url) {
            if (!url) return "";
            let cleaned = url.trim();
            if (cleaned.includes("drive.google.com")) {
                let match = cleaned.match(/\/d\/([a-zA-Z0-9-_]+)/) || cleaned.match(/id=([a-zA-Z0-9-_]+)/);
                if (match && match[1]) {
                    return `https://drive.google.com/uc?export=view&id=${match[1]}`;
                }
            }
            return cleaned;
        }

        function normalizeYM(str) {
            if(!str) return "";
            let clean = str.replace(/\s+/g, "").replace(/-/g, "/");
            let parts = clean.split("/");
            if(parts.length >= 2) {
                let y = parts[0];
                let m = String(parseInt(parts[1], 10)).padStart(2, '0');
                return `${y}/${m}`;
            }
            return clean;
        }

        try {
            let localData = localStorage.getItem("date_driven_landlord_data");
            if (localData && localData !== "[]" && localData !== "undefined") {
                myData = JSON.parse(localData);
                if (Array.isArray(myData)) { myData = { [selectedYear]: myData }; }
            }
        } catch (e) { console.error(e); }

        if (!myData[selectedYear]) myData[selectedYear] = [];
        document.getElementById("yearSelect").value = selectedYear;

        function checkPermission() {
            if (!isAdmin && !isPublicEditing) {
                alert("🔒 目前為對外招租/唯讀模式。管理員請點擊右上角「管理員登入」。");
                return false;
            }
            return true;
        }

        function toggleViewMode() {
            isAdmin = false; isFullView = false; currentFilter = 'vacant';
            alert("👁️ 已切換為「對外公開招租頁模式」。");
            renderDashboard(false);
        }

        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false; isFullView = false; currentFilter = 'all';
                alert("已登出管理員身份。");
            } else {
                let pass = prompt("🔑 請輸入管理員密碼：");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true; isFullView = true; currentFilter = 'all';
                    alert("🔓 管理權限已開啟。");
                } else if (pass !== null) {
                    alert("❌ 密碼錯誤！");
                }
            }
            renderDashboard(false, true);
        }

        function updateAuthUI() {
            const adminBtn = document.getElementById("adminBtn");
            const btnAddGroup = document.getElementById("headerAddGroup");
            const btnAddRoom = document.getElementById("headerAddRoom");
            const btnSync = document.getElementById("headerSync");
            const btnBackup = document.getElementById("backupBtn");
            const topFinancialGrid = document.getElementById("topFinancialGrid");
            const exportBtn = document.getElementById("exportBtn");
            const yearSelectWrapper = document.getElementById("yearSelectWrapper");

        function generateLeaseMonths(periodStr) {
            let months = [];
            if (!periodStr || !periodStr.includes("~")) {
                let defaultYear = parseInt(selectedYear) || new Date().getFullYear();
                for(let i=1; i<=12; i++) months.push(`${defaultYear}/${String(i).padStart(2, '0')}`);
                return months;
            }
            try {
                let parts = periodStr.split("~");
                let startPart = parts[0].trim().split("/");
                let sYear = parseInt(startPart[0]), sMonth = parseInt(startPart[1]);
                if(isNaN(sYear) || isNaN(sMonth)) {
                    let defaultYear = parseInt(selectedYear) || new Date().getFullYear();
                    for(let i=1; i<=12; i++) months.push(`${defaultYear}/${String(i).padStart(2, '0')}`);
                    return months;
                }
                for(let i = 0; i < 12; i++) {
                    let currentMonth = sMonth + i, currentYear = sYear;
                    if (currentMonth > 12) {
                        currentYear += Math.floor((currentMonth - 1) / 12);
                        currentMonth = ((currentMonth - 1) % 12) + 1;
                    }
                    months.push(`${currentYear}/${String(currentMonth).padStart(2, '0')}`);
                }
                return months;
            } catch(e) { return months; }
        }

            let nextPeriod = "2027/06 ~ 2028/05"; 
            if (room.rentPeriod && room.rentPeriod.includes("~")) {
                try {
                    let parts = room.rentPeriod.split("~");
                    let endParts = parts[1].trim().split("/");
                    let endY = parseInt(endParts[0]), endM = parseInt(endParts[1]);
                    
                    let nStartY = endY, nStartM = endM + 1;
                    if (nStartM > 12) { nStartY += 1; nStartM = 1; }
                    
                    let nEndY = nStartY, nEndM = nStartM + 11;
                    if (nEndM > 12) { nEndY += 1; nEndM = nEndM - 12; }
                    
                    nextPeriod = `${nStartY}/${String(nStartM).padStart(2,'0')} ~ ${nEndY}/${String(nEndM).padStart(2,'0')}`;
                } catch(e) {}
            }
            document.getElementById("renewNewPeriod").value = nextPeriod;

        function checkLeaseExpiry(periodStr) {
            if (!periodStr || !periodStr.includes("~")) return { warning: false, text: "" };
            try {
                let parts = periodStr.split("~");
                let endYM = parts[1].trim().split("/");
                let endDate = new Date(parseInt(endYM[0]), parseInt(endYM[1]), 0); 
                let daysDiff = Math.ceil((endDate.getTime() - new Date().getTime()) / (1000 * 3600 * 24));
                if (daysDiff < 0) return { warning: true, text: "⚠️ 租約已過期！" };
                if (daysDiff <= 45) return { warning: true, text: `⚠️ 租約剩 ${daysDiff} 天到期` };
            } catch(e) {}
            return { warning: false, text: "" };
        }

                    }

            document.getElementById("editGroupIndex").value = gIdx; 
            document.getElementById("editRoomIndex").value = rIdx;
            document.getElementById("inputRoomNumber").value = room.number || ""; 
            document.getElementById("inputTenant").value = room.tenant || "";
            document.getElementById("inputPeriod").value = room.rentPeriod || ""; 
            document.getElementById("inputRent").value = room.rent || 0;
            document.getElementById("inputRoomImg").value = room.roomImg || "";
            document.getElementById("inputRoomTags").value = room.roomTags || "";
            document.getElementById("inputMemo").value = room.memo || "";
        }

        function openPublicEditRoomModal(gIdx, rIdx) {
            isPublicEditing = true; 
            let room = myData[selectedYear][gIdx].rooms[rIdx];
            openRoomModal();
            
            document.getElementById("editGroupIndex").value = gIdx; 
            document.getElementById("editRoomIndex").value = rIdx;
            document.getElementById("inputRoomNumber").value = room.number || ""; 
            document.getElementById("inputTenant").value = room.tenant || "待租";
            document.getElementById("inputPeriod").value = room.rentPeriod || ""; 
            document.getElementById("inputRent").value = room.rent || 0;
            document.getElementById("inputRoomImg").value = room.roomImg || "";
            document.getElementById("inputRoomTags").value = room.roomTags || "";
            document.getElementById("inputMemo").value = room.memo || "";

            document.getElementById("selectGroup").disabled = true;
            document.getElementById("inputRoomNumber").disabled = true;
            document.getElementById("inputTenant").disabled = true;
            document.getElementById("inputPeriod").disabled = true;
            document.getElementById("inputMemo").disabled = true;
            document.getElementById("utilityCalculatorWrapper").style.display = "none";
            document.getElementById("depositFormGroup").style.display = "none";
        }

        function closeRoomModal() { 
            document.getElementById("roomModal").style.display = "none"; 
            isPublicEditing = false;
        }

        function submitRoom() {
            if (!checkPermission()) return;
            let gIdx = document.getElementById("selectGroup").value;
            let num = document.getElementById("inputRoomNumber").value; if(!num) return;
            let tenant = document.getElementById("inputTenant").value || "待租";
            let rent = Number(document.getElementById("inputRent").value);
            let period = document.getElementById("inputPeriod").value;
            
            let rawImgUrl = document.getElementById("inputRoomImg").value;
            let processedImgUrl = convertGoogleDriveLink(rawImgUrl);
            
            let roomTags = document.getElementById("inputRoomTags").value;
            let memo = document.getElementById("inputMemo").value;
            
            let oldGIdx = document.getElementById("editGroupIndex").value;
            let oldRIdx = document.getElementById("editRoomIndex").value;
            let isEdit = oldGIdx !== "" && oldRIdx !== "";

            let bills = [];
            let leaseMonths = generateLeaseMonths(period);
            for (let i = 0; i < 12; i++) {
                let oldDate = isEdit ? (myData[selectedYear][oldGIdx].rooms[oldRIdx].bills.find(b => normalizeYM(b.name) === normalizeYM(leaseMonths[i]))?.paidDate || "") : "";
                bills.push({ name: leaseMonths[i], amount: rent, paidDate: oldDate });
            }

            let roomObj = { number: num, tenant, rentPeriod: period, memo, rent, roomImg: processedImgUrl, roomTags, bills, repairs: [] };
            if (isEdit) { myData[selectedYear][gIdx].rooms[oldRIdx] = roomObj; } 
            else { myData[selectedYear][gIdx].rooms.push(roomObj); }
            
            closeRoomModal();
            renderDashboard(true, false); 
            if(isPublicEditing) { alert("✨ 招租資訊與雲端照片已同步更新！"); }
            isPublicEditing = false;
        }

        function deleteRoom(gIdx, rIdx) {
            if (!checkPermission()) return;
            if(confirm("確定刪除房源？")) { myData[selectedYear][gIdx].rooms.splice(rIdx, 1); renderDashboard(true, true); }
        }
    </script>
</body>
</html>
