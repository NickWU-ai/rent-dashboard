<!DOCTYPE html>
<html>
<head>
    <title>物業資產財務管理系統 🏢</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; padding: 40px; color: #1e293b; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #0f172a; margin: 0; font-size: 28px; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 5px; }
        .btn { padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; }
        .btn-primary { background-color: #2563eb; color: white; }
        .group-section { background-color: #ffffff; border-radius: 16px; padding: 25px; margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .group-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px; }
        .group-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; }
        .group-edit-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .group-edit-btn:hover { background-color: #eff6ff; }
        .card-container { display: flex; flex-wrap: wrap; gap: 20px; }
        
        /* 房源卡片與到期警告樣式 */
        .room-card { background-color: #f8fafc; border-radius: 12px; padding: 20px; width: 340px; position: relative; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .room-card.expiry-warning { border: 2px solid #f97316 !important; background-color: #fff7ed !important; }
        .expiry-badge { background-color: #ffedd5; color: #ea580c; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; display: inline-block; border: 1px solid #fed7aa; }
        
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
        .delete-btn { color: #ef4444; }
        .edit-btn { color: #2563eb; }
        .room-number { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .info-text { font-size: 13px; color: #64748b; margin-bottom: 6px; }
        .memo-badge { background-color: #fffbeb; color: #b45309; border: 1px dashed #fde68a; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 8px; margin-bottom: 4px; line-height: 1.4; word-break: break-all; }
        .ledger-box { background-color: #ffffff; border-radius: 8px; padding: 12px; margin-top: 15px; border: 1px solid #edf2f7; }
        .ledger-title { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .bill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .bill-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #f8fafc; padding: 6px; border-radius: 6px; }
        .extra-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #eff6ff; padding: 7px 10px; border-radius: 6px; border: 1px solid #bfdbfe; color: #1e40af; }
        .memo-text { font-size: 11px; color: #64748b; padding-left: 20px; line-height: 1.4; margin: 0 0 10px 0; }
        
        .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; user-select: none; text-align: center; min-width: 45px; display: inline-block; }
        .status-paid { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-unpaid { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; display: none; z-index: 1000; }
        .modal-box { background-color: white; padding: 30px; border-radius: 16px; width: 460px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .custom-item-box { background-color: #f1f5f9; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        .custom-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .custom-list { font-size: 12px; color: #475569; margin-top: 5px; padding-left: 20px; margin-bottom: 0; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        #sync-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); display: none; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; color: #2563eb; z-index: 9999; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sync-overlay">
        <div class="spinner"></div>
        <div id="sync-overlay-text">⏳ 資料儲存至雲端中，請稍候...</div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="cloud-form" method="POST" action="https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="jsonString" id="formJsonField">
    </form>

    <div class="header-container">
        <div>
            <h1>物業資產財務管理系統 🏢</h1>
            <div class="subtitle" id="connection-status">🟢 系統載入中...</div>
        </div>
        <div>
            <button class="btn" style="background-color: #64748b; color: white; margin-right: 10px;" onclick="forceDownloadFromCloud()">🔄 雲端同步</button>
            <button class="btn" style="background-color: #f59e0b; color: white; margin-right: 10px;" onclick="downloadBackup()">📥 下載備份</button>
            <button class="btn btn-primary" onclick="openGroupModal()">＋ 新增社區</button>
            <button class="btn btn-primary" style="background-color: #10b981;" onclick="openRoomModal()">＋ 新增房源</button>
        </div>
    </div>
    
    <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 25px;">
        <div id="dashboard-zone" style="display: grid; grid-template-columns: 1fr; gap: 12px;"></div>
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; height: 230px; box-sizing: border-box;">
            <div style="font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 10px;">📊 年度歷史實收租金趨勢</div>
            <div style="height: 160px; position: relative;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 14px; font-weight: 600; color: #475569;">🔍 房源動態篩選：</span>
            <select id="filterSelect" onchange="handleFilterChange(this.value)" style="padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #f8fafc; color:#1e293b; font-weight:600;">
                <option value="all">顯示全部房源</option>
                <option value="unpaid">只看本月「未收租」</option>
                <option value="expiry">只看「即將到期 / 已過期」</option>
            </select>
        </div>
        <button class="btn" style="background-color: #16a34a; color: white;" onclick="exportToCSV()">📊 匯出本月 Excel 報表</button>
    </div>
    
    <div id="group-zone"></div>

    <div class="modal-overlay" id="groupModal">
        <div class="modal-box">
            <div class="modal-title" id="groupModalTitle">📍 新增社區群組</div>
            <input type="hidden" id="editGroupIndexFlag" value="">
            <div class="form-group">
                <label>社區/街道名稱</label>
                <input type="text" id="inputGroupName" placeholder="例如：福中街">
            </div>
            <div class="modal-buttons">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeGroupModal()">取消</button>
                <button class="btn btn-primary" id="submitGroupBtn" onclick="submitGroup()">確定建立</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="roomModal">
        <div class="modal-box">
            <div class="modal-title" id="roomModalTitle">🚪 新增房源與財務設定</div>
            <input type="hidden" id="editGroupIndex" value="">
            <input type="hidden" id="editRoomIndex" value="">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>隸屬社區</label>
                    <select id="selectGroup"></select>
                </div>
                <div class="form-group">
                    <label>房間號碼</label>
                    <input type="text" id="inputRoomNumber" placeholder="例如：102">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>租客姓名</label>
                    <input type="text" id="inputTenant" placeholder="例如：林小華">
                </div>
                <div class="form-group">
                    <label>租合約期</label>
                    <input type="text" id="inputPeriod" value="2026/06 ~ 2027/05">
                </div>
            </div>
            <div class="form-group">
                <label>📝 房源備註事項</label>
                <input type="text" id="inputMemo" placeholder="例如：冷氣剛換新、車位在B2...">
            </div>

            <div class="form-group">
                <label>⚡ 獨立水電費計算機 (自動匯入臨時特殊月費)</label>
                <div class="custom-item-box" style="background-color: #f0fdf4; border-color: #bbf7d0; margin-bottom: 10px;">
                    <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 6px; margin-bottom: 8px;">
                        <input type="text" id="calcName" value="電費" style="padding:6px;">
                        <input type="number" id="calcPrev" placeholder="上次度數" style="padding:6px;">
                        <input type="number" id="calcCurr" placeholder="本次度數" style="padding:6px;">
                        <input type="number" id="calcRate" value="5" placeholder="單價" style="padding:6px;">
                    </div>
                    <button class="btn" style="background-color: #16a34a; color: white; width: 100%; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 4px;" onclick="calculateUtility()">🧮 計算並匯入下方項目</button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 15px 0;">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>💰 每月基本租金</label>
                    <input type="number" id="inputRent" value="12000">
                </div>
                <div class="form-group">
                    <label>🤝 單次房屋押金</label>
                    <input type="number" id="inputDeposit" value="24000">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>🛡️ 每月管理費</label>
                    <input type="number" id="inputManage" value="0">
                </div>
                <div class="form-group">
                    <label>🚗 每月車位費</label>
                    <input type="number" id="inputParking" value="0">
                </div>
            </div>
            <div class="form-group">
                <label>🐾 每月寵物清潔費</label>
                <input type="number" id="inputPet" value="0">
            </div>
            <div class="form-group">
                <label>✍️ 其他臨時特殊月費</label>
                <div class="custom-item-box" id="customItemBoxSection">
                    <div class="custom-input-group">
                        <input type="text" id="customName" placeholder="項目名稱" style="flex: 2;">
                        <input type="number" id="customAmount" placeholder="金額" style="flex: 1;">
                        <button class="btn btn-primary" style="padding: 0 12px; background-color: #475569;" onclick="addCustomBillItem()">＋加入</button>
                    </div>
                    <ul class="custom-list" id="customListVisual"></ul>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeRoomModal()">取消</button>
                <button class="btn btn-primary" style="background-color: #10b981;" id="submitRoomBtn" onclick="submitRoom()">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec";
        let myData = [];
        let tempCustomBills = [];
        let currentFilter = 'all';
        let chartInstance = null;

        try {
            let localData = localStorage.getItem("date_driven_landlord_data");
            if (localData && localData !== "[]" && localData !== "undefined") myData = JSON.parse(localData);
        } catch (e) { console.error("本地資料異常", e); }

        renderDashboard(false);

        if (myData.length === 0) {
            document.getElementById("connection-status").innerText = "⏳ 嘗試從雲端還原資料...";
            fetch(`${CLOUD_API_URL}?t=${Date.now()}`)
                .then(res => res.json())
                .then(cloudJson => {
                    if (cloudJson && Object.keys(cloudJson).length > 0) {
                        myData = cloudJson;
                        localStorage.setItem("date_driven_landlord_data", JSON.stringify(myData));
                        renderDashboard(false);
                        document.getElementById("connection-status").innerText = "🟢 雲端資料已成功還原";
                    } else {
                        document.getElementById("connection-status").innerText = "🟢 系統就緒 (目前資料庫為空)";
                    }
                }).catch(() => document.getElementById("connection-status").innerText = "⚠️ 雲端連線失敗 (單機模式)");
        } else {
            document.getElementById("connection-status").innerText = "🟢 本機資料就緒";
        }

        function forceDownloadFromCloud() {
            if(!confirm("⚠️ 確定要從雲端下載最新資料覆蓋目前畫面嗎？")) return;
            document.getElementById("sync-overlay").style.display = "flex";
            document.getElementById("sync-overlay-text").innerText = "⬇️ 從雲端下載中...";
            fetch(`${CLOUD_API_URL}?t=${Date.now()}`)
                .then(res => res.json())
                .then(cloudJson => {
                    if (cloudJson && Object.keys(cloudJson).length > 0) {
                        myData = cloudJson;
                        localStorage.setItem("date_driven_landlord_data", JSON.stringify(myData));
                        renderDashboard(false);
                        alert("✅ 同步完成！");
                    } else { alert("⚠️ 雲端無資料。"); }
                }).catch(() => alert("❌ 下載失敗"))
                .finally(() => document.getElementById("sync-overlay").style.display = "none");
        }

        function downloadBackup() {
            if (!myData.length) return alert("沒有資料可供下載！");
            let blob = new Blob([JSON.stringify(myData, null, 4)], { type: "application/json" });
            let today = new Date();
            let dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `物業資料備份_${dateStr}.json`;
            a.click();
        }

        function saveToCloud() {
            let overlay = document.getElementById("sync-overlay");
            if(overlay) overlay.style.display = "flex";
            let currentJson = JSON.stringify(myData);
            localStorage.setItem("date_driven_landlord_data", currentJson);
            document.getElementById("formJsonField").value = currentJson;
            document.getElementById("cloud-form").submit();
            setTimeout(() => { if(overlay) overlay.style.display = "none"; }, 2500);
        }

        function copyLineMessage(tenant, roomNum, billName, amount) {
            let msg = `${tenant}您好，提醒您：您 ${roomNum} 室的 ${billName} 共計 $${amount.toLocaleString()} 元尚未入帳。若已匯款請忽略此訊息並提供帳號後五碼供核對，謝謝！`;
            navigator.clipboard.writeText(msg).then(() => {
                alert(`📋 【${tenant}】的催繳訊息已成功複製！\n\n請直接打開 Line 貼上傳送即可。`);
            }).catch(() => alert("複製失敗，瀏覽器不支援"));
        }

        function checkLeaseExpiry(periodStr) {
            if (!periodStr || !periodStr.includes("~")) return { warning: false, text: "" };
            try {
                let parts = periodStr.split("~");
                let endPart = parts[1].trim(); 
                let endYM = endPart.split("/");
                let endYear = parseInt(endYM[0]);
                let endMonth = parseInt(endYM[1]) - 1;
                let endDate = new Date(endYear, endMonth + 1, 0); 
                let today = new Date();
                let timeDiff = endDate.getTime() - today.getTime();
                let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
                if (daysDiff < 0) return { warning: true, text: "⚠️ 租約已過期！" };
                if (daysDiff <= 45) return { warning: true, text: `⚠️ 租約剩 ${daysDiff} 天到期` };
            } catch(e) {}
            return { warning: false, text: "" };
        }

        function calculateUtility() {
            let name = document.getElementById("calcName").value || "電費";
            let prev = document.getElementById("calcPrev").value;
            let curr = document.getElementById("calcCurr").value;
            let rate = Number(document.getElementById("calcRate").value) || 5;
            if (prev === "" || curr === "") return alert("請輸入完整度數！");
            let pNum = Number(prev), cNum = Number(curr);
            if (cNum < pNum) return alert("本次度數不能小於上次度數喔！");
            let degrees = cNum - pNum;
            let total = degrees * rate;
            tempCustomBills.push({ name: `${name}(${degrees}度,${pNum}→${cNum})`, amount: total });
            document.getElementById("customListVisual").innerHTML = tempCustomBills.map(item => `<li>${item.name}: (每月 +${item.amount.toLocaleString()})</li>`).join("");
            document.getElementById("calcPrev").value = ""; document.getElementById("calcCurr").value = "";
            alert(`✅ 已匯入：${degrees}度共 $${total.toLocaleString()} 元。`);
        }

        // 功能 1：篩選切換
        function handleFilterChange(val) {
            currentFilter = val;
            renderDashboard(false);
        }

        // 功能 2：匯出報表（整合 BOM 避免 Excel 開啟亂碼）
        function exportToCSV() {
            if (!myData.length) return alert("目前沒有資料可供匯出！");
            let today = new Date();
            let curM = "M" + String(today.getMonth() + 1).padStart(2, '0');
            let csvContent = "\ufeff社區/街道,房號,租客,租約期,本月應收項目與金額,本月實收狀態,房源備註\n";
            
            myData.forEach(g => {
                g.rooms.forEach(r => {
                    let mBill = r.bills.find(b => b.name === `${curM} 總應收`);
                    let status = (mBill && mBill.paidDate) ? `已入帳(${mBill.paidDate})` : "未入帳";
                    let amt = mBill ? mBill.amount : 0;
                    csvContent += `"${g.groupName}","${r.number}","${r.tenant}","${r.rentPeriod}","$${amt.toLocaleString()}","${status}","${(r.memo || '').replace(/"/g, '""')}"\n`;
                });
            });
            
            let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `物業收租月報表_${today.getFullYear()}_${curM}.csv`;
            a.click();
        }

        // 功能 3：專屬修繕紀錄簿
        function addRepairLog(gIdx, rIdx) {
            let input = prompt("🛠️ 新增修繕與事件紀錄\n請輸入格式：『項目名稱,金額』\n例如：修洗臉盆,1200\n(日期會自動帶入今天)");
            if (!input) return;
            let parts = input.split(",");
            let name = parts[0]?.trim();
            let cost = Number(parts[1]?.trim()) || 0;
            if (!name) return alert("項目名稱不可為空！");
            
            if (!myData[gIdx].rooms[rIdx].repairs) myData[gIdx].rooms[rIdx].repairs = [];
            let today = new Date();
            let dateStr = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
            
            myData[gIdx].rooms[rIdx].repairs.push({ date: dateStr, name, cost });
            renderDashboard();
        }

        function deleteRepairLog(gIdx, rIdx, repIdx) {
            if (confirm("確定要刪除這筆修繕事件紀錄嗎？")) {
                myData[gIdx].rooms[rIdx].repairs.splice(repIdx, 1);
                renderDashboard();
            }
        }

        // 功能 4：Chart.js 渲染與動態更新
        function drawChart() {
            let monthlyCashflow = Array(12).fill(0);
            myData.forEach(g => g.rooms.forEach(r => r.bills.forEach(b => {
                if (b.name.startsWith("M") && b.paidDate && b.paidDate.trim() !== "") {
                    let mIdx = parseInt(b.name.substring(1, 3)) - 1;
                    if (mIdx >= 0 && mIdx < 12) monthlyCashflow[mIdx] += b.amount;
                }
            })));

            let ctx = document.getElementById('revenueChart');
            if (!ctx) return;
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                    datasets: [{
                        label: '實收租金現金流',
                        data: monthlyCashflow,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderDashboard(triggerSave = true) {
            let groupZone = document.getElementById("group-zone");
            let dashZone = document.getElementById("dashboard-zone");
            let today = new Date();
            let curM = "M" + String(today.getMonth() + 1).padStart(2, '0');

            if (!myData.length) {
                dashZone.innerHTML = ""; groupZone.innerHTML = `
                    <div style="text-align:center; padding:60px; color:#64748b; background:white; border-radius:16px; border:1px dashed #cbd5e1; margin-top:20px;">
                        <p style="font-size:18px; margin-bottom:12px;">👋 歡迎使用！請點擊右上角「＋ 新增社區」開始建立物業。</p>
                    </div>`;
                return;
            }

            // 指標計算
            let dashExpected = 0, dashPaid = 0, dashUnpaid = 0;
            myData.forEach(g => g.rooms.forEach(r => r.bills.forEach(b => {
                if (b.name === `${curM} 總應收`) {
                    dashExpected += b.amount;
                    if (b.paidDate && b.paidDate.trim() !== "") dashPaid += b.amount;
                    else dashUnpaid += b.amount;
                }
            })));

            dashZone.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; height: 100%;">
                    <div style="background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 5px solid #2563eb; display:flex; flex-direction:column; justify-content:center;">
                        <div style="font-size: 11px; color: #64748b; font-weight: 600;">本月 (${curM}) 預期應收</div>
                        <div style="font-size: 20px; font-weight: 700; color: #0f172a; margin-top: 4px;">$${dashExpected.toLocaleString()}</div>
                    </div>
                    <div style="background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 5px solid #10b981; display:flex; flex-direction:column; justify-content:center;">
                        <div style="font-size: 11px; color: #64748b; font-weight: 600;">本月 (${curM}) 實收入帳</div>
                        <div style="font-size: 20px; font-weight: 700; color: #166534; margin-top: 4px;">$${dashPaid.toLocaleString()}</div>
                    </div>
                    <div style="background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 5px solid #ef4444; display:flex; flex-direction:column; justify-content:center;">
                        <div style="font-size: 11px; color: #64748b; font-weight: 600;">本月 (${curM}) 剩餘待繳</div>
                        <div style="font-size: 20px; font-weight: 700; color: #991b1b; margin-top: 4px;">$${dashUnpaid.toLocaleString()}</div>
                    </div>
                </div>`;

            // 卡片渲染與動態篩選
            groupZone.innerHTML = myData.map((group, gIdx) => {
                let filteredRooms = group.rooms.filter(room => {
                    if (currentFilter === 'unpaid') {
                        let mBill = room.bills.find(b => b.name === `${curM} 總應收`);
                        return mBill && (!mBill.paidDate || mBill.paidDate.trim() === "");
                    }
                    if (currentFilter === 'expiry') {
                        return checkLeaseExpiry(room.rentPeriod).warning;
                    }
                    return true;
                });

                if (filteredRooms.length === 0 && currentFilter !== 'all') return '';

                return `
                <div class="group-section">
                    <div class="group-header">
                        <h2 class="group-title">📍 ${group.groupName} (${filteredRooms.length} 個符合房源)
                            <button class="group-edit-btn" onclick="openEditGroupModal(${gIdx})">✏️ 編輯名稱</button>
                        </h2>
                    </div>
                    <div class="card-container">
                        ${filteredRooms.map((room, rIdx) => {
                            let originalRoomIdx = group.rooms.indexOf(room);
                            let depositHTML = "", monthsHTML = "";
                            room.bills.forEach((bill, bIdx) => {
                                let isPaid = bill.paidDate && bill.paidDate.trim() !== "";
                                let badge = `<span class="status-badge ${isPaid ? 'status-paid' : 'status-unpaid'}" onclick="changePaidDate(${gIdx},${originalRoomIdx},${bIdx})">${isPaid ? bill.paidDate : '未收'}</span>`;
                                if(!isPaid && !bill.name.includes("押金")) {
                                    badge += ` <button class="action-btn" style="color:#06b6d4; font-size:12px; font-weight:bold;" onclick="event.stopPropagation(); copyLineMessage('${room.tenant}', '${room.number}', '${bill.name}', ${bill.amount})">💬</button>`;
                                }
                                if (bill.name.includes("押金")) {
                                    depositHTML = `<div class="extra-row"><span>${bill.name}: <strong>$${bill.amount.toLocaleString()}</strong></span>${badge}</div>`;
                                } else {
                                    monthsHTML += `<div class="bill-row"><span>${bill.name}: <strong>$${bill.amount.toLocaleString()}</strong></span>${badge}</div>`;
                                }
                            });

                            let expiry = checkLeaseExpiry(room.rentPeriod);
                            
                            // 修繕紀錄 HTML
                            let repairsHTML = (room.repairs || []).map((rep, repIdx) => `
                                <div style="display:flex; justify-content:space-between; font-size:11px; background:#f1f5f9; padding:4px 6px; border-radius:4px; margin-bottom:4px; color:#475569;">
                                    <span>🛠️ ${rep.date} ${rep.name} (<strong>$${rep.cost.toLocaleString()}</strong>)</span>
                                    <button style="border:none; background:none; color:#ef4444; cursor:pointer;" onclick="event.stopPropagation(); deleteRepairLog(${gIdx},${originalRoomIdx},${repIdx})">✕</button>
                                </div>
                            `).join("");

                            return `
                                <div class="${expiry.warning ? 'room-card expiry-warning' : 'room-card'}">
                                    <div class="card-actions">
                                        <button class="action-btn edit-btn" onclick="openEditRoomModal(${gIdx},${originalRoomIdx})">✏️</button>
                                        <button class="action-btn delete-btn" onclick="deleteRoom(${gIdx},${originalRoomIdx})">✕</button>
                                    </div>
                                    <div class="room-number">🚪 ${room.number} 室</div>
                                    <div class="info-text">👤 租客: <strong>${room.tenant}</strong></div>
                                    <div class="info-text">📅 租期: ${room.rentPeriod}</div>
                                    ${expiry.text ? `<div class="expiry-badge">${expiry.text}</div>` : ''}
                                    ${room.memo && room.memo.trim() ? `<div class="memo-badge">📝 備註: ${room.memo}</div>` : ''}
                                    <div class="ledger-box">
                                        <div class="ledger-title">📋 每月收費結構</div>
                                        <ul class="memo-text">${(room.details || []).map(d => `<li>${d}</li>`).join("")}</ul>
                                        
                                        <div class="ledger-title">🛠️ 修繕與事件紀錄簿 <button style="color:#2563eb; background:none; border:none; cursor:pointer; font-weight:bold; font-size:11px;" onclick="addRepairLog(${gIdx},${originalRoomIdx})">＋新增</button></div>
                                        <div style="max-height:80px; overflow-y:auto; margin-bottom:10px;">${repairsHTML || '<div style="font-size:11px; color:#94a3b8; text-align:center;">暫無紀錄</div>'}</div>

                                        <div class="ledger-title">💵 單次收費項目</div>${depositHTML}
                                        <div class="ledger-title" style="margin-top:10px;">📅 每月實收現金流 (入帳日)</div>
                                        <div class="bill-grid">${monthsHTML}</div>
                                    </div>
                                </div>`;
                        }).join("")}
                    </div>
                </div>`;
            }).join("");
            
            drawChart();
            if(triggerSave) saveToCloud();
        }

        function changePaidDate(gIdx, rIdx, bIdx) {
            let bill = myData[gIdx].rooms[rIdx].bills[bIdx];
            let newDate = prompt("請輸入入帳日期 (留空代表重設為『未收』)：", bill.paidDate || "");
            if (newDate === null) return;
            bill.paidDate = newDate.trim();
            renderDashboard();
        }

        function addCustomBillItem() {
            let name = document.getElementById("customName").value, amt = document.getElementById("customAmount").value;
            if (!name || !amt) return alert("請填寫項目名稱與金額！");
            tempCustomBills.push({ name, amount: Number(amt) });
            document.getElementById("customListVisual").innerHTML = tempCustomBills.map(item => `<li>${item.name}: (每月 +${item.amount.toLocaleString()})</li>`).join("");
            document.getElementById("customName").value = ""; document.getElementById("customAmount").value = "";
        }

        function openGroupModal() { 
            document.getElementById("groupModalTitle").innerText = "📍 新增社區群組";
            document.getElementById("submitGroupBtn").innerText = "確定建立";
            document.getElementById("editGroupIndexFlag").value = ""; 
            document.getElementById("inputGroupName").value = "";
            document.getElementById("groupModal").style.display = "flex"; 
        }

        function openEditGroupModal(gIdx) {
            document.getElementById("groupModalTitle").innerText = "✏️ 編輯社區名稱";
            document.getElementById("submitGroupBtn").innerText = "儲存修改";
            document.getElementById("editGroupIndexFlag").value = gIdx; 
            document.getElementById("inputGroupName").value = myData[gIdx].groupName;
            document.getElementById("groupModal").style.display = "flex";
        }

        function closeGroupModal() { document.getElementById("groupModal").style.display = "none"; }
        
        function openRoomModal() {
            if (!myData.length) return alert("請先建立社區！");
            document.getElementById("selectGroup").innerHTML = myData.map((g, i) => `<option value="${i}">${g.groupName}</option>`).join("");
            document.getElementById("roomModalTitle").innerText = "🚪 新增房源與財務設定";
            document.getElementById("submitRoomBtn").innerText = "確認新增";
            document.getElementById("editGroupIndex").value = ""; document.getElementById("editRoomIndex").value = "";
            document.getElementById("customItemBoxSection").style.opacity = "1";
            document.getElementById("customItemBoxSection").style.pointerEvents = "auto";
            tempCustomBills = []; document.getElementById("customListVisual").innerHTML = "";
            document.getElementById("inputRoomNumber").value = ""; document.getElementById("inputTenant").value = "";
            document.getElementById("inputMemo").value = ""; document.getElementById("inputRent").value = "12000";
            document.getElementById("inputDeposit").value = "24000"; document.getElementById("inputManage").value = "0";
            document.getElementById("inputParking").value = "0"; document.getElementById("inputPet").value = "0";
            document.getElementById("calcPrev").value = ""; document.getElementById("calcCurr").value = "";
            document.getElementById("roomModal").style.display = "flex";
        }

        function openEditRoomModal(gIdx, rIdx) {
            let room = myData[gIdx].rooms[rIdx];
            openRoomModal(); 
            document.getElementById("roomModalTitle").innerText = `✏️ 編輯 🚪 ${room.number} 室 房源財務`;
            document.getElementById("submitRoomBtn").innerText = "儲存修改";
            document.getElementById("editGroupIndex").value = gIdx; document.getElementById("editRoomIndex").value = rIdx;
            document.getElementById("customItemBoxSection").style.opacity = "0.5";
            document.getElementById("customItemBoxSection").style.pointerEvents = "none";
            document.getElementById("selectGroup").value = gIdx;
            document.getElementById("inputRoomNumber").value = room.number; document.getElementById("inputTenant").value = room.tenant;
            document.getElementById("inputPeriod").value = room.rentPeriod; document.getElementById("inputMemo").value = room.memo || "";
            document.getElementById("inputRent").value = room.rent || 12000; document.getElementById("inputDeposit").value = room.deposit !== undefined ? room.deposit : 24000;
            document.getElementById("inputManage").value = room.manage || 0; document.getElementById("inputParking").value = room.parking || 0;
            document.getElementById("inputPet").value = room.pet || 0;
        }

        function closeRoomModal() { document.getElementById("roomModal").style.display = "none"; }

        function submitGroup() {
            let name = document.getElementById("inputGroupName").value;
            if(!name) return alert("請輸入名稱");
            let flag = document.getElementById("editGroupIndexFlag").value;
            if (flag !== "") { myData[flag].groupName = name; } else { myData.push({ groupName: name, rooms: [] }); }
            renderDashboard(); closeGroupModal();
        }

        function submitRoom() {
            let gIdx = document.getElementById("selectGroup").value, num = document.getElementById("inputRoomNumber").value;
            if(!num) return alert("請輸入房號");
            
            let tenant = document.getElementById("inputTenant").value || "新租客", rent = Number(document.getElementById("inputRent").value);
            let deposit = Number(document.getElementById("inputDeposit").value), period = document.getElementById("inputPeriod").value;
            let memo = document.getElementById("inputMemo").value, manage = Number(document.getElementById("inputManage").value) || 0;
            let parking = Number(document.getElementById("inputParking").value) || 0, pet = Number(document.getElementById("inputPet").value) || 0;

            let oldGIdx = document.getElementById("editGroupIndex").value, oldRIdx = document.getElementById("editRoomIndex").value;
            let isEdit = oldGIdx !== "" && oldRIdx !== "";

            let monthlyTotal = rent + manage + parking + pet;
            let details = [`基本租金: $${rent.toLocaleString()}`];
            if (manage > 0) details.push(`管理費: $${manage.toLocaleString()}`);
            if (parking > 0) details.push(`車位費: $${parking.toLocaleString()}`);
            if (pet > 0) details.push(`寵物費: $${pet.toLocaleString()}`);

            let customTotal = 0;
            if (isEdit) {
                customTotal = myData[oldGIdx].rooms[oldRIdx].customTotal || 0;
                monthlyTotal += customTotal;
                let oldCustom = (myData[oldGIdx].rooms[oldRIdx].details || []).filter(d => !d.includes("基本租金") && !d.includes("管理費") && !d.includes("車位費") && !d.includes("寵物費"));
                details = details.concat(oldCustom);
            } else {
                tempCustomBills.forEach(item => {
                    monthlyTotal += item.amount; customTotal += item.amount;
                    details.push(`${item.name}: $${item.amount.toLocaleString()}`);
                });
            }

            let bills = [];
            if (deposit > 0) {
                let oldDepDate = isEdit ? (myData[oldGIdx].rooms[oldRIdx].bills.find(b => b.name.includes("押金"))?.paidDate || "") : "";
                bills.push({ name: "🤝 房屋押金", amount: deposit, paidDate: oldDepDate });
            }

            for (let i = 1; i <= 12; i++) {
                let m = String(i).padStart(2, '0');
                let oldDate = isEdit ? (myData[oldGIdx].rooms[oldRIdx].bills.find(b => b.name === `M${m} 總應收`)?.paidDate || "") : "";
                bills.push({ name: `M${m} 總應收`, amount: monthlyTotal, paidDate: oldDate });
            }

            // 確保修繕紀錄與既有欄位在編輯時不會丟失
            let repairs = isEdit ? (myData[oldGIdx].rooms[oldRIdx].repairs || []) : [];
            let roomObj = { number: num, tenant, rentPeriod: period, memo, rent, deposit, manage, parking, pet, customTotal, details, bills, repairs };

            if (isEdit) {
                if (oldGIdx != gIdx) { myData[oldGIdx].rooms.splice(oldRIdx, 1); myData[gIdx].rooms.push(roomObj); } 
                else { myData[gIdx].rooms[oldRIdx] = roomObj; }
            } else { myData[gIdx].rooms.push(roomObj); }

            renderDashboard(); closeRoomModal();
        }

        function deleteRoom(gIdx, rIdx) {
            if(confirm("確定刪除？")) { myData[gIdx].rooms.splice(rIdx, 1); renderDashboard(); }
        }
    </script>
</body>
</html>
