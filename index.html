<!DOCTYPE html>
<html>
<head>
    <title>物業資產財務管理系統 🏢</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; padding: 40px; color: #1e293b; margin: 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #0f172a; margin: 0; font-size: 28px; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 5px; }
        .btn { padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; transition: background 0.2s; }
        .btn-primary { background-color: #2563eb; color: white; }
        .group-section { background-color: #ffffff; border-radius: 16px; padding: 25px; margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .group-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 20px; }
        .group-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; }
        .group-edit-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .group-edit-btn:hover { background-color: #eff6ff; }
        
        /* RWD 彈性網格佈局 */
        .card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        /* 房源卡片與到期警告樣式 */
        .room-card { background-color: #f8fafc; border-radius: 12px; padding: 20px; position: relative; border: 1px solid #e2e8f0; transition: all 0.2s; box-sizing: border-box; }
        .room-card.expiry-warning { border: 2px solid #f97316 !important; background-color: #fff7ed !important; }
        .expiry-badge { background-color: #ffedd5; color: #ea580c; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; display: inline-block; border: 1px solid #fed7aa; }
        
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
        .delete-btn { color: #ef4444; }
        .edit-btn { color: #2563eb; }
        .room-number { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .info-text { font-size: 13px; color: #64748b; margin-bottom: 6px; }
        .memo-badge { background-color: #fffbeb; color: #b45309; border: 1px dashed #fde68a; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 8px; margin-bottom: 4px; line-height: 1.4; word-break: break-all; }
        
        .ledger-box { background-color: #ffffff; border-radius: 8px; padding: 12px; margin-top: 15px; border: 1px solid #edf2f7; }
        .ledger-title { font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .bill-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .bill-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; }
        
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; user-select: none; text-align: center; min-width: 65px; display: inline-block; cursor: pointer; }
        .status-paid { background-color: #dcfce7; color: #15803d; }
        .status-unpaid { background-color: #fee2e2; color: #b91c1c; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); display: flex; justify-content: center; align-items: center; display: none; z-index: 1000; }
        .modal-box { background-color: white; padding: 30px; border-radius: 16px; width: 460px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .custom-item-box { background-color: #f1f5f9; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        .custom-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .custom-list { font-size: 12px; color: #475569; margin-top: 5px; padding-left: 20px; margin-bottom: 0; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        
        #sync-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); display: none; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; color: #2563eb; z-index: 9999; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 修繕列表樣式 */
        .repair-item { font-size: 12px; display: flex; justify-content: space-between; align-items: center; background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; padding: 6px; border-radius: 6px; margin-top: 4px; }

        @media (max-width: 768px) {
            body { padding: 15px; }
            .header-container { flex-direction: column; align-items: flex-start; gap: 15px; }
            .header-container div:last-child { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
            .btn { flex: 1 1 45%; text-align: center; padding: 12px 10px; font-size: 13px; }
            .top-grid { grid-template-columns: 1fr !important; gap: 15px; }
            .top-grid > div { height: auto !important; }
            .toolbar-container { flex-direction: column; align-items: stretch !important; gap: 12px; }
            .toolbar-container .controls-wrapper { flex-direction: column; align-items: stretch !important; gap: 10px; }
            .toolbar-container .control-item { width: 100%; justify-content: space-between; }
            .toolbar-container select { flex: 1; max-width: 60%; box-sizing: border-box; }
            .toolbar-container button { width: 100%; }
            .card-container { grid-template-columns: 1fr !important; }
            .modal-box { width: 95%; padding: 20px; }
            .form-row-grid { grid-template-columns: 1fr; gap: 0; }
            .status-badge { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="sync-overlay">
        <div class="spinner"></div>
        <div id="sync-overlay-text">⏳ 資料儲存至雲端中，請稍候...</div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="cloud-form" method="POST" action="https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="jsonString" id="formJsonField">
    </form>

    <div class="header-container">
        <div>
            <h1>物業資產財務管理系統 🏢</h1>
            <div class="subtitle" id="connection-status">🟢 系統載入中...</div>
        </div>
        <div>
            <button class="btn" id="viewerBtn" style="background-color: #0ea5e9; color: white;" onclick="toggleViewMode()">👁️ 完整閱覽登入</button>
            <button class="btn" id="adminBtn" style="background-color: #475569; color: white;" onclick="toggleAdminMode()">🔐 管理員登入</button>
            <button class="btn" id="headerSync" style="background-color: #64748b; color: white;" onclick="forceDownloadFromCloud()">🔄 雲端同步</button>
            <button class="btn" id="backupBtn" style="background-color: #f59e0b; color: white;" onclick="downloadBackup()">📥 下載備份</button>
            <button class="btn btn-primary" id="headerAddGroup" onclick="openGroupModal()">＋ 新增社區</button>
            <button class="btn btn-primary" id="headerAddRoom" style="background-color: #10b981;" onclick="openRoomModal()">＋ 新增房源</button>
        </div>
    </div>
    
    <div id="topFinancialGrid" class="top-grid" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 25px;">
        <div id="dashboard-zone" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;"></div>
        <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; height: 230px; box-sizing: border-box;">
            <div style="font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 10px;">📊 年度歷史實收租金趨勢</div>
            <div style="height: 160px; position: relative;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>

    <div class="toolbar-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
        <div class="controls-wrapper" style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <div class="control-item" style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 14px; font-weight: 700; color: #1e293b;">📅 選擇年度：</span>
                <select id="yearSelect" onchange="handleYearChange(this.value)" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #ffffff; color:#2563eb; font-weight:700;">
                    <option value="2025">2025 年</option>
                    <option value="2026">2026 年</option>
                    <option value="2027">2027 年</option>
                    <option value="2028">2028 年</option>
                    <option value="2029">2029 年</option>
                    <option value="2030">2030 年</option>
                    <option value="2031">2031 年</option>
                    <option value="2032">2032 年</option>
                    <option value="2033">2033 年</option>
                    <option value="2034">2034 年</option>
                    <option value="2035">2035 年</option>
                    <option value="2036">2036 年</option>
                </select>
            </div>
            <div class="control-item" style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 14px; font-weight: 600; color: #475569;">🔍 篩選條件：</span>
                <select id="filterSelect" onchange="handleFilterChange(this.value)" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background: #f8fafc; color:#1e293b; font-weight:600;">
                    <option value="all">1. 全部房源</option>
                    <option value="vacant">2. 有房間但沒租約 (待租中房源)</option>
                    <option value="unpaid">3. 未繳租金</option>
                    <optgroup label="4. 房屋群組 (單獨社區顯示)" id="dropdownGroupSection"></optgroup>
                </select>
            </div>
        </div>
        <button id="exportBtn" class="btn" style="background-color: #16a34a; color: white;" onclick="exportToCSV()">📊 匯出本月 Excel 報表</button>
    </div>
    
    <div id="group-zone"></div>

    <div class="modal-overlay" id="groupModal">
        <div class="modal-box">
            <div class="modal-title" id="groupModalTitle">📍 新增社區群組</div>
            <input type="hidden" id="editGroupIndexFlag" value="">
            <div class="form-group">
                <label>社區/街道名稱</label>
                <input type="text" id="inputGroupName" placeholder="例如：福中街">
            </div>
            <div class="modal-buttons">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeGroupModal()">取消</button>
                <button class="btn btn-primary" id="submitGroupBtn" onclick="submitGroup()">確定建立</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="roomModal">
        <div class="modal-box">
            <div class="modal-title" id="roomModalTitle">🚪 新增房源與財務設定</div>
            <input type="hidden" id="editGroupIndex" value="">
            <input type="hidden" id="editRoomIndex" value="">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>隸屬社區</label>
                    <select id="selectGroup"></select>
                </div>
                <div class="form-group">
                    <label>房間號碼</label>
                    <input type="text" id="inputRoomNumber" placeholder="例如：102">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>租客姓名</label>
                    <input type="text" id="inputTenant" placeholder="例如: 林小華">
                </div>
                <div class="form-group">
                    <label>租合約期</label>
                    <input type="text" id="inputPeriod" value="2026/06 ~ 2027/05" placeholder="格式範例: 2026/06 ~ 2027/05">
                </div>
            </div>
            <div class="form-group">
                <label>📝 房源備註事項</label>
                <input type="text" id="inputMemo" placeholder="例如：冷氣剛換新、車位在B2...">
            </div>

            <div class="form-group">
                <label>⚡ 獨立水電費計算機 (自動匯入臨時特殊月費)</label>
                <div class="custom-item-box" style="background-color: #f0fdf4; border-color: #bbf7d0; margin-bottom: 10px;">
                    <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr; gap: 6px; margin-bottom: 8px;">
                        <input type="text" id="calcName" value="電費" style="padding:6px;">
                        <input type="number" id="calcPrev" placeholder="上次" style="padding:6px;">
                        <input type="number" id="calcCurr" placeholder="本次" style="padding:6px;">
                        <input type="number" id="calcRate" value="5" placeholder="單價" style="padding:6px;">
                    </div>
                    <button class="btn" style="background-color: #16a34a; color: white; width: 100%; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 4px;" onclick="calculateUtility()">🧮 計算並匯入下方項目</button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 15px 0;">
            <div class="form-row-grid">
                <div class="form-group">
                    <label>💰 每月基本租金</label>
                    <input type="number" id="inputRent" value="12000">
                </div>
                <div class="form-group">
                    <label>🤝 單次房屋押金</label>
                    <input type="number" id="inputDeposit" value="24000">
                </div>
            </div>
            <div class="form-row-grid">
                <div class="form-group">
                    <label>🛡️ 每月管理費</label>
                    <input type="number" id="inputManage" value="0">
                </div>
                <div class="form-group">
                    <label>🚗 每月車位費</label>
                    <input type="number" id="inputParking" value="0">
                </div>
            </div>
            <div class="form-group">
                <label>🐾 每月寵物清潔費</label>
                <input type="number" id="inputPet" value="0">
            </div>
            <div class="form-group">
                <label>✍️ 其他臨時特殊月費</label>
                <div class="custom-item-box" id="customItemBoxSection">
                    <div class="custom-input-group">
                        <input type="text" id="customName" placeholder="項目名稱" style="flex: 2;">
                        <input type="number" id="customAmount" placeholder="金額" style="flex: 1;">
                        <button class="btn btn-primary" style="padding: 0 12px; background-color: #475569;" onclick="addCustomBillItem()">＋加入</button>
                    </div>
                    <ul class="custom-list" id="customListVisual"></ul>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn" style="background-color:#cbd5e1;" onclick="closeRoomModal()">取消</button>
                <button class="btn btn-primary" style="background-color: #10b981;" id="submitRoomBtn" onclick="submitRoom()">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbw-uwKwzY6mIDtQOkC81pUj68huKnx2qZ3PKIbQtKfPycfyGpqhC4ln1Um-idpTBNrGbw/exec";
        
        let isAdmin = false;
        let isFullView = false; 
        const ADMIN_PASSWORD = "2007"; 
        const VIEWER_PASSWORD = "5678"; 

        let myData = {}; 
        let selectedYear = "2026"; 
        let tempCustomBills = [];
        let currentFilter = 'all'; 
        let chartInstance = null;

        try {
            let localData = localStorage.getItem("date_driven_landlord_data");
            if (localData && localData !== "[]" && localData !== "undefined") {
                let parsed = JSON.parse(localData);
                if (Array.isArray(parsed)) {
                    myData = {};
                    myData[selectedYear] = parsed;
                } else {
                    myData = parsed;
                }
            }
        } catch (e) { console.error("本地資料讀取異常", e); }

        if (!myData[selectedYear]) myData[selectedYear] = [];
        document.getElementById("yearSelect").value = selectedYear;

        function checkPermission() {
            if (!isAdmin) {
                alert("🔒 目前為「唯讀模式」，不允許執行此操作。\n若需使用，請先點擊網頁右上角的「管理員登入」。");
                return false;
            }
            return true;
        }

        function toggleViewMode() {
            if (isFullView) {
                isFullView = false;
                alert("已切換回「訪客看房模式」，系統將自動鎖定僅顯示待租中房源。");
            } else {
                let pass = prompt("🔑 請輸入閱覽者密碼以查看完整房源與財務資產：");
                if (pass === VIEWER_PASSWORD) {
                    isFullView = true;
                    alert("🔓 密碼正確！已解鎖完整房源瀏覽與報表檢視模式。");
                } else if (pass !== null) {
                    alert("❌ 密碼錯誤，保持訪客模式！");
                }
            }
            renderDashboard(false);
        }

        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                isFullView = false;
                alert("已登出管理員身分。系統切換回「訪客看房模式」。");
            } else {
                let pass = prompt("🔑 請輸入管理員密碼：");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    isFullView = true; 
                    alert("🔓 密碼正確！已開啟主控編輯權限。");
                } else if (pass !== null) {
                    alert("❌ 密碼錯誤，保持訪客模式！");
                }
            }
            renderDashboard(false);
        }

        function updateAuthUI() {
            const adminBtn = document.getElementById("adminBtn");
            const viewerBtn = document.getElementById("viewerBtn");
            const btnAddGroup = document.getElementById("headerAddGroup");
            const btnAddRoom = document.getElementById("headerAddRoom");
            const btnSync = document.getElementById("headerSync");
            const btnBackup = document.getElementById("backupBtn");
            const topFinancialGrid = document.getElementById("topFinancialGrid");
            const exportBtn = document.getElementById("exportBtn");
            
            if (isAdmin) {
                adminBtn.innerHTML = "🔓 管理模式 (登出)";
                adminBtn.style.backgroundColor = "#dc2626";
                if(btnAddGroup) btnAddGroup.style.display = "inline-block";
                if(btnAddRoom) btnAddRoom.style.display = "inline-block";
                if(btnSync) btnSync.style.display = "inline-block";
                if(btnBackup) btnBackup.style.display = "inline-block";
                viewerBtn.style.display = "none";
            } else {
                adminBtn.innerHTML = "🔐 管理員登入";
                adminBtn.style.backgroundColor = "#475569";
                if(btnAddGroup) btnAddGroup.style.display = "none";
                if(btnAddRoom) btnAddRoom.style.display = "none";
                if(btnSync) btnSync.style.display = "none";
                if(btnBackup) btnBackup.style.display = "none";
                viewerBtn.style.display = "inline-block";
                
                if (isFullView) {
                    viewerBtn.innerHTML = "👁️ 模式：完整閱覽 (切回訪客)";
                    viewerBtn.style.backgroundColor = "#0284c7";
                } else {
                    viewerBtn.innerHTML = "👁️ 完整閱覽登入";
                    viewerBtn.style.backgroundColor = "#0ea5e9";
                }
            }

            if (isAdmin || isFullView) {
                if(topFinancialGrid) topFinancialGrid.style.display = "grid";
                if(exportBtn) exportBtn.style.display = "inline-block";
            } else {
                if(topFinancialGrid) topFinancialGrid.style.display = "none";
                if(exportBtn) exportBtn.style.display = "none";
            }
        }

        function generateLeaseMonths(periodStr) {
            let months = [];
            let defaultYear = parseInt(selectedYear) || new Date().getFullYear();
            let fallback = [];
            for(let i=1; i<=12; i++) {
                fallback.push(`${defaultYear}/${String(i).padStart(2, '0')}`);
            }

            if (!periodStr || !periodStr.includes("~")) return fallback;
            try {
                let parts = periodStr.split("~");
                let startPart = parts[0].trim();
                let startYM = startPart.split("/");
                let sYear = parseInt(startYM[0]);
                let sMonth = parseInt(startYM[1]);
                
                if(isNaN(sYear) || isNaN(sMonth)) return fallback;
                for(let i = 0; i < 12; i++) {
                    let currentMonth = sMonth + i;
                    let currentYear = sYear;
                    if (currentMonth > 12) {
                        currentYear += Math.floor((currentMonth - 1) / 12);
                        currentMonth = ((currentMonth - 1) % 12) + 1;
                    }
                    months.push(`${currentYear}/${String(currentMonth).padStart(2, '0')}`);
                }
                return months;
            } catch(e) { return fallback; }
        }

        function updateFilterDropdown(forceRefreshHTML = false) {
            const filterSelect = document.getElementById("filterSelect");
            const groupSection = document.getElementById("dropdownGroupSection");
            if (!filterSelect || !groupSection) return;
            
            let activeData = myData[selectedYear] || [];
            if (forceRefreshHTML || groupSection.children.length !== activeData.length) {
                let html = "";
                activeData.forEach((g, idx) => {
                    html += `<option value="group_${idx}">📍 ${g.groupName}</option>`;
                });
                groupSection.innerHTML = html;
            }
            if (currentFilter.startsWith('group_')) {
                let idx = parseInt(currentFilter.replace('group_', ''));
                if (isNaN(idx) || idx >= activeData.length) { currentFilter = 'all'; }
            }
            filterSelect.value = currentFilter;
        }

        if (myData[selectedYear].length === 0) {
            document.getElementById("connection-status").innerText = "⏳ 嘗試從雲端還原資料...";
            fetch(`${CLOUD_API_URL}?t=${Date.now()}`)
                .then(res => res.json())

        function checkLeaseExpiry(periodStr) {
            if (!periodStr || !periodStr.includes("~")) return { warning: false, text: "" };
            try {
                let parts = periodStr.split("~");
                let endPart = parts[1].trim();
                let endYM = endPart.split("/");
                let endYear = parseInt(endYM[0]);
                let endMonth = parseInt(endYM[1]) - 1;
                let endDate = new Date(endYear, endMonth + 1, 0);
                let today = new Date();
                let timeDiff = endDate.getTime() - today.getTime();
                let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
                if (daysDiff < 0) return { warning: true, text: "⚠️ 租約已過期！" };
                if (daysDiff <= 45) return { warning: true, text: `⚠️ 租約剩 ${daysDiff} 天到期` };
            } catch(e) {}
            return { warning: false, text: "" };
        }

        function renewLeaseOneClick(gIdx, rIdx) {
            if (!checkPermission()) return;
            let activeData = myData[selectedYear] || [];
            let oldRoom = activeData[gIdx].rooms[rIdx];
            
            let nextYearStr = String(Number(selectedYear) + 1);
            if (!confirm(`🔄 確定要啟動一鍵續約功能嗎？\n\n系統將會把房源【${oldRoom.number} 室 - ${oldRoom.tenant || '無租客'}】完整複製移交至下一年 (${nextYearStr} 年) 的相同社區中。`)) return;

            let nextPeriod = `${nextYearStr}/06 ~ ${String(Number(nextYearStr)+1)}/05`;
            if (oldRoom.rentPeriod && oldRoom.rentPeriod.includes("~")) {
                try {
                    let p = oldRoom.rentPeriod.split("~");
                    let startY = parseInt(p[0].trim().split("/")[0]) + 1;
                    let startM = p[0].trim().split("/")[1];
                    let endY = parseInt(p[1].trim().split("/")[0]) + 1;
                    let endM = p[1].trim().split("/")[1];
                    nextPeriod = `${startY}/${startM} ~ ${endY}/${endM}`;
                } catch(e){}
            }

            if (!myData[nextYearStr]) myData[nextYearStr] = [];
            
            let targetGroup = myData[nextYearStr].find(g => g.groupName === activeData[gIdx].groupName);
            if (!targetGroup) {
                targetGroup = { groupName: activeData[gIdx].groupName, rooms: [] };
                myData[nextYearStr].push(targetGroup);
            }

            let monthlyTotal = Number(oldRoom.rent||0) + Number(oldRoom.manage||0) + Number(oldRoom.parking||0) + Number(oldRoom.pet||0) + Number(oldRoom.customTotal||0);
            let newBills = [];
            let leaseMonths = generateLeaseMonths(nextPeriod);
            for(let i=0; i<12; i++){
                newBills.push({ name: leaseMonths[i], amount: monthlyTotal, paidDate: "" });
            }

            let newRoomObj = {
                number: oldRoom.number, tenant: oldRoom.tenant, rentPeriod: nextPeriod, memo: oldRoom.memo,
                rent: oldRoom.rent, deposit: oldRoom.deposit, manage: oldRoom.manage, parking: oldRoom.parking, pet: oldRoom.pet,
                customTotal: oldRoom.customTotal, details: [...(oldRoom.details || [])], bills: newBills, repairs: []
            };

            targetGroup.rooms = targetGroup.rooms.filter(r => r.number !== oldRoom.number);
            targetGroup.rooms.push(newRoomObj);

            alert(`✅ 續約成功！已將該房源建立至 ${nextYearStr} 年度帳本中。\n\n您現在切換至 ${nextYearStr} 年即可查看新合約明細！`);
            saveToCloud();
            renderDashboard(true, false);
        }

        // ==========================================
        // 核心渲染函式：儀表板與卡片渲染
        // ==========================================
        function renderDashboard(triggerCloudSave = true, forceRefreshDropdown = false) {
            updateAuthUI();
            updateFilterDropdown(forceRefreshDropdown);

            let activeData = myData[selectedYear] || [];
            
            let todayObj = new Date();
            let currentYM = `${todayObj.getFullYear()}/${String(todayObj.getMonth() + 1).padStart(2, '0')}`;

            let totalRentExpected = 0;
            let totalRentCollected = 0;
            let uncollectedCount = 0;

            let zone = document.getElementById("group-zone");
            if (!zone) return;
            zone.innerHTML = "";

            activeData.forEach((group, gIdx) => {
                if (currentFilter.startsWith('group_')) {
                    let fIdx = parseInt(currentFilter.replace('group_', ''));
                    if (fIdx !== gIdx) return;
                }

                let groupHtml = `
                    <div class="group-section">
                        <div class="group-header">
                            <h2 class="group-title">📍 ${group.groupName} 
                                <button class="group-edit-btn" style="display: ${isAdmin ? 'inline-block' : 'none'};" onclick="openGroupModal(${gIdx})">修改名稱</button>
                                <button class="group-edit-btn" style="display: ${isAdmin ? 'inline-block' : 'none'}; color:#ef4444;" onclick="deleteGroup(${gIdx})">刪除社區</button>
                            </h2>
                        </div>
                        <div class="card-container">
                `;

                let roomCardsCount = 0;

                group.rooms.forEach((room, rIdx) => {
                    let isVacant = (!room.tenant || room.tenant.trim() === "");
                    
                    if (!isAdmin && !isFullView) {
                        if (!isVacant) return; 
                    }

                    if (currentFilter === 'vacant' && !isVacant) return;

                    let thisMonthBill = room.bills ? room.bills.find(b => b.name === currentYM) : null;
                    let billAmount = thisMonthBill ? Number(thisMonthBill.amount) : (Number(room.rent||0) + Number(room.manage||0) + Number(room.parking||0) + Number(room.pet||0) + Number(room.customTotal||0));
                    if (isNaN(billAmount)) billAmount = 0;

                    let isPaid = (thisMonthBill && thisMonthBill.paidDate && thisMonthBill.paidDate.trim() !== "");

                    if (currentFilter === 'unpaid' && (isVacant || isPaid)) return;

                    roomCardsCount++;

                    if (!isVacant) {
                        totalRentExpected += billAmount;
                        if (isPaid) {
                            totalRentCollected += billAmount;
                        } else {
                            uncollectedCount++;
                        }
                    }

                    let expiry = checkLeaseExpiry(room.rentPeriod);
                    let cardClass = expiry.warning ? "room-card expiry-warning" : "room-card";

                    let billRowsHtml = "";
                    if (room.bills && room.bills.length > 0) {
                        room.bills.forEach((b, bIdx) => {
                            let bAmt = Number(b.amount) || 0;
                            let statusClass = b.paidDate ? "status-badge status-paid" : "status-badge status-unpaid";
                            let statusTxt = b.paidDate ? `已入帳(${b.paidDate.substring(5)})` : "未入帳";
                            
                            let highlightStyle = (b.name === currentYM) ? 'style="background: #fef08a; border: 1px solid #facc15;"' : '';
                            
                            billRowsHtml += `
                                <div class="bill-row" ${highlightStyle}>
                                    <span style="font-weight:600; color:#2563eb; cursor:pointer;" onclick="editBillDetail(${gIdx}, ${rIdx}, ${bIdx})" title="點擊修改金額與日期">📅 ${b.name}</span>
                                    <span style="color:#0f172a; font-weight:bold;">$${bAmt.toLocaleString()}</span>
                                    <span class="${statusClass}" onclick="toggleBillPaidStatus(${gIdx},${rIdx},${bIdx})">${statusTxt}</span>
                                </div>
                            `;
                        });
                    } else {
                        billRowsHtml = `<div style="font-size:12px; color:#94a3b8; text-align:center;">尚未生成合約帳單</div>`;
                    }

                    let repairRowsHtml = "";
                    if (room.repairs && room.repairs.length > 0) {
                        room.repairs.forEach((rep, repIdx) => {
                            let rCost = Number(rep.cost) || 0;
                            repairRowsHtml += `
                                <div class="repair-item">
                                    <span>🛠️ ${rep.date} - ${rep.name}</span>
                                    <span style="font-weight:bold;">$${rCost.toLocaleString()} 
                                        <span style="color:#ef4444; cursor:pointer; margin-left:6px;" onclick="deleteRepairLog(${gIdx},${rIdx},${repIdx})">❌</span>
                                    </span>
                                </div>
                            `;
                        });
                    } else {
                        repairRowsHtml = `<div style="font-size:11px; color:#94a3b8; text-align:center; padding:4px;">暫無維修事件紀錄</div>`;
                    }

                    let actionRow = "";
                    if (room.tenant) {
                        actionRow += `<button class="btn" style="background-color:#eff6ff; color:#2563eb; width:100%; font-size:12px; padding:6px; margin-top:10px; border:1px solid #bfdbfe;" onclick="copyLineMessage('${room.tenant}','${room.number}','${currentYM}租金',${billAmount})">💬 複製 Line 催繳通知</button>`;
                    }

                    let renewalBarHTML = "";
                    if (expiry.warning && isAdmin) {
                        renewalBarHTML = `
                            <div style="background:#fff7ed; border:1px dashed #ea580c; border-radius:8px; padding:8px; margin-top:10px; text-align:center;">
                                <span style="font-size:12px; color:#ea580c; font-weight:bold;">租約即將到期！</span>
                                <button class="btn" style="background-color:#ea580c; color:white; font-size:11px; padding:3px 8px; margin-top:4px; border-radius:4px;" onclick="renewLeaseOneClick(${gIdx}, ${rIdx})">🔄 一鍵複製結構續約下一年</button>
                            </div>
                        `;
                    }

                    groupHtml += `
                        <div class="${cardClass}">
                            <div class="card-actions" style="display: ${isAdmin ? 'flex' : 'none'};">
                                <button class="action-btn edit-btn" onclick="openRoomModal(${gIdx}, ${rIdx})">✏️</button>
                                <button class="action-btn delete-btn" onclick="deleteRoom(${gIdx}, ${rIdx})">🗑️</button>
                            </div>
                            <div class="room-number">🚪 ${room.number} 室</div>
                            <div class="info-text">👤 租客姓名：<span style="color:#0f172a; font-weight:700;">${room.tenant || '❌ 待租中 (暫無合約)'}</span></div>
                            <div class="info-text">📆 合約租期：${room.rentPeriod ? `<span style="color:#2563eb; font-weight:600;">${room.rentPeriod}</span>` : '無'}</div>
                            ${expiry.text ? `<div class="expiry-badge">${expiry.text}</div>` : ''}
                            ${room.memo ? `<div class="memo-badge">📝 備註：${room.memo}</div>` : ''}
                            
                            <div class="ledger-box" style="display: ${(isAdmin || isFullView) ? 'block' : 'none'};">
                                <div class="ledger-title" style="cursor:pointer; user-select:none; color:#2563eb;" onclick="document.getElementById('bill_drawer_${gIdx}_${rIdx}').style.display = document.getElementById('bill_drawer_${gIdx}_${rIdx}').style.display === 'none' ? 'block' : 'none'">
                                    <span>📅 展開查看 12個月歷史合約帳單</span>
                                    <span>🔽</span>
                                </div>
                                <div id="bill_drawer_${gIdx}_${rIdx}" style="display:none; margin-top:10px;">
                                    <div style="font-size:11px; color:#64748b; margin-bottom:6px;">(提示：點月份名稱可改金額與日期)</div>
                                    <div class="bill-grid">${billRowsHtml}</div>
                                </div>
                            </div>
                                
                            <div class="ledger-box" style="border-color: #fee2e2; background: #fffafb; display: ${(isAdmin || isFullView) ? 'block' : 'none'};">
                                <div class="ledger-title" style="cursor:pointer; user-select:none; color:#dc2626;" onclick="document.getElementById('repair_drawer_${gIdx}_${rIdx}').style.display = document.getElementById('repair_drawer_${gIdx}_${rIdx}').style.display === 'none' ? 'block' : 'none'">
                                    <span>🛠️ 查看修繕事件紀錄</span>
                                    <span>🔽</span>
                                </div>
                                <div id="repair_drawer_${gIdx}_${rIdx}" style="display:none; margin-top:10px;">
                                    <button style="width:100%; font-size:11px; background:#475569; color:white; border:none; padding:4px; border-radius:4px; cursor:pointer; margin-bottom:6px;" onclick="addRepairLog(${gIdx}, ${rIdx})">＋新增修繕紀錄</button>
                                    <div>${repairRowsHtml}</div>
                                </div>
                            </div>

                            ${actionRow}
                            ${renewalBarHTML}
                        </div>
                    `;
                });

                groupHtml += `
                        </div>
                    </div>
                `;

                if (roomCardsCount > 0 || currentFilter === 'all' || currentFilter.startsWith('group_')) {
                    zone.innerHTML += groupHtml;
                }
            });

            // 頂部儀表板渲染
            let dbZone = document.getElementById("dashboard-zone");
            if (dbZone && (isAdmin || isFullView)) {
                let totalProperties = 0, vacantCount = 0;
                activeData.forEach(g => g.rooms.forEach(r => {
                    totalProperties++;
                    if (!r.tenant || !r.rentPeriod) vacantCount++;
                }));

                dbZone.innerHTML = `
                    <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center;">
                        <div style="font-size: 13px; color: #64748b; font-weight: 600;">🏢 總託管房源</div>
                        <div style="font-size: 24px; font-weight: 800; color: #0f172a; margin-top: 5px;">${totalProperties} 間</div>
                        <div style="font-size: 11px; color: #ea580c; margin-top: 4px;">待租空房：${vacantCount} 間</div>
                    </div>
                    <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center;">
                        <div style="font-size: 13px; color: #64748b; font-weight: 600;">💰 本月應收總額 (${currentYM})</div>
                        <div style="font-size: 24px; font-weight: 800; color: #2563eb; margin-top: 5px;">$${totalRentExpected.toLocaleString()}</div>
                        <div style="font-size: 11px; color: #16a34a; margin-top: 4px;">本月實收：$${totalRentCollected.toLocaleString()}</div>
                    </div>
                    <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center;">
                        <div style="font-size: 13px; color: #64748b; font-weight: 600;">🚨 未收租催繳</div>
                        <div style="font-size: 24px; font-weight: 800; color: #ef4444; margin-top: 5px;">${uncollectedCount} 戶</div>
                        <div style="font-size: 11px; color: #475569; margin-top: 4px;">催繳完成率：${totalRentExpected ? ((totalRentCollected/totalRentExpected)*100).toFixed(1) : 0}%</div>
                    </div>
                `;
            }

            drawChart();

            if (triggerCloudSave) {
                saveToCloud();
            }
        }

        // ==========================================
        // 圖表統計函數：加入完善防呆
        // ==========================================
        function drawChart() {
            let monthlyCashflow = Array(12).fill(0);
            let activeData = myData[selectedYear] || [];

            activeData.forEach(g => g.rooms.forEach(r => {
                if (r.bills) {
                    r.bills.forEach(b => {
                        if (b.paidDate && b.paidDate.trim() !== "") {
                            let parts = b.paidDate.split("/");
                            let mIdx = -1;
                            if (parts.length >= 2) {
                                let mStr = parts.length === 3 ? parts[1] : parts[0];
                                mIdx = parseInt(mStr) - 1;
                            }
                            if (mIdx >= 0 && mIdx < 12) {
                                let val = Number(b.amount) || 0;
                                if (!isNaN(val)) {
                                    monthlyCashflow[mIdx] += val;
                                }
                            }
                        }
                    });
                }
            }));

            let ctx = document.getElementById('revenueChart');
            if (!ctx) return;
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                    datasets: [{
                        label: `${selectedYear} 年實收租金現金流`,
                        data: monthlyCashflow,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.08)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) { return '$' + value.toLocaleString(); }
                            },
                            grid: { color: '#f1f5f9' }
                        },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        window.onload = function() {
            renderDashboard(true, true);
        };
    </script>
</body>
</html>
